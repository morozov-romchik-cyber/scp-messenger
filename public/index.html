<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCP FOUNDATION // SECURE TERMINAL</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%230a0e0a' width='100' height='100'/%3E%3Ctext x='50' y='70' font-size='54' text-anchor='middle' fill='%2344cc44' font-family='monospace' font-weight='bold'%3ESCP%3C/text%3E%3C/svg%3E">
    
    <!-- ============================================================
         CSS СТИЛИ
         ============================================================ -->
    <style>
        :root {
            --bg: #0a0e0a; --bg2: #111611; --bg3: #171e17; --bg4: #1f281f;
            --border: #2a352a; --border2: #3a4a3a;
            --text: #c8d4c8; --text-dim: #6a7a6a; --text-hi: #e8f4e8;
            --accent: #44cc44; --accent-dim: #2a662a; --accent-glow: #44cc4488;
            --danger: #cc4444; --danger-dim: #661a1a;
            --warn: #ccaa44; --warn-dim: #665522;
            --font: 'Courier New', Consolas, monospace;
            --radius: 6px; --radius-lg: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        button {
            font-family: inherit; cursor: pointer; border: 0; background: none;
            color: inherit; font-size: inherit; outline: none; transition: 0.15s;
        }

        input, select, textarea {
            font-family: inherit; font-size: inherit; color: inherit;
            background: var(--bg3); border: 1px solid var(--border);
            padding: 8px 12px; border-radius: var(--radius); outline: none;
        }
        input:focus, textarea:focus { border-color: var(--accent); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

        /* --- ЛОГИН --- */
        .login-screen {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, #0f160f, #050705); z-index: 1000;
        }
        .login-box {
            background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 40px 32px; width: min(400px, 90vw); text-align: center; box-shadow: 0 0 40px var(--accent-glow);
        }
        .login-logo { font-size: 64px; font-weight: 900; color: var(--accent); letter-spacing: 8px; margin-bottom: 8px; text-shadow: 0 0 20px var(--accent-glow); }
        .login-sub { color: var(--text-dim); font-size: 11px; letter-spacing: 4px; margin-bottom: 32px; text-transform: uppercase; }
        .login-tabs { display: flex; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
        .login-tab { flex: 1; padding: 12px; color: var(--text-dim); font-size: 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; text-transform: uppercase; }
        .login-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .login-form { display: flex; flex-direction: column; gap: 12px; }
        .login-form input { text-align: center; }
        .login-error { color: var(--danger); font-size: 12px; min-height: 16px; text-align: center; }
        
        .btn-primary { background: var(--accent-dim); color: var(--text-hi); padding: 12px; border: 1px solid var(--accent); border-radius: var(--radius); font-weight: bold; letter-spacing: 1px; }
        .btn-primary:hover { background: var(--accent); color: var(--bg); }
        .btn-secondary { background: var(--bg3); color: var(--text); padding: 10px 16px; border: 1px solid var(--border2); border-radius: var(--radius); }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
        .btn-danger { background: var(--danger-dim); color: var(--text-hi); padding: 10px 16px; border: 1px solid var(--danger); border-radius: var(--radius); }

        /* --- ОСНОВНОЙ ИНТЕРФЕЙС --- */
        .app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; transition: 0.2s; }
        .app.admin-open { grid-template-columns: 320px 1fr 400px; }

        /* --- САЙДБАР --- */
        .sidebar { background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .brand { font-weight: 900; font-size: 20px; color: var(--accent); letter-spacing: 2px; }
        .brand-dot { color: var(--danger); font-size: 10px; margin-left: 3px; animation: pulse 2s infinite; }
        @keyframes pulse { 50% { opacity: 0.3; } }
        .sidebar-actions { display: flex; gap: 4px; }
        .icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); color: var(--text-dim); font-size: 16px; position: relative; }
        .icon-btn:hover { background: var(--bg3); color: var(--accent); }
        .icon-btn.primary { background: var(--accent-dim); color: var(--text-hi); }
        .icon-btn.primary:hover { background: var(--accent); color: var(--bg); }
        
        .sidebar-search { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        .sidebar-search input { width: 100%; border-radius: 20px; font-size: 12px; }
        .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 10px; font-size: 11px; color: var(--text-dim); border-bottom: 2px solid transparent; margin-bottom: -1px; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .chat-list { flex: 1; overflow-y: auto; padding: 4px; }
        .chat-item { padding: 10px; border-radius: var(--radius); cursor: pointer; display: flex; gap: 10px; align-items: center; transition: 0.1s; }
        .chat-item:hover { background: var(--bg3); }
        .chat-item.active { background: var(--bg4); border-left: 3px solid var(--accent); }
        .chat-item-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--bg4); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent); overflow: hidden; flex-shrink: 0; border: 1px solid var(--border2); position: relative; }
        .chat-item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-item-avatar .online-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg2); }
        .chat-item-body { flex: 1; min-width: 0; }
        .chat-item-name { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
        .chat-item-preview { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .chat-item-badge { background: var(--accent); color: var(--bg); padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: bold; }
        
        .sidebar-footer { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .me-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--bg4); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent); overflow: hidden; flex-shrink: 0; position: relative; }
        .me-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .me-name { font-size: 12px; color: var(--text-hi); font-weight: bold; }
        .me-sub { font-size: 10px; color: var(--text-dim); }

        /* --- ОБЛАСТЬ ЧАТА --- */
        .chat-area { background: var(--bg); display: flex; flex-direction: column; min-width: 0; position: relative; }
        .chat-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); }
        .chat-empty-logo { font-size: 100px; font-weight: 900; color: var(--bg3); letter-spacing: 10px; }
        .chat-view { flex: 1; display: flex; flex-direction: column; height: 100%; }
        
        .chat-header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--bg2); }
        .chat-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--bg4); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent); overflow: hidden; cursor: pointer; }
        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-name { font-size: 15px; color: var(--text-hi); font-weight: bold; }
        .chat-sub { font-size: 11px; color: var(--text-dim); }

        /* --- СООБЩЕНИЯ --- */
        .messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { display: flex; gap: 8px; max-width: 75%; align-self: flex-start; animation: fadein 0.2s; }
        .msg.self { align-self: flex-end; flex-direction: row-reverse; }
        @keyframes fadein { from { opacity: 0; transform: translateY(4px); } }
        .msg-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--bg4); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: var(--accent); overflow: hidden; flex-shrink: 0; cursor: pointer; }
        .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .msg-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .msg-header { display: flex; gap: 6px; font-size: 10px; align-items: baseline; flex-wrap: wrap; }
        .msg-sender { color: var(--accent); font-weight: bold; cursor: pointer; }
        .msg-time { color: var(--text-dim); }
        .msg-bubble { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 8px 12px; word-wrap: break-word; white-space: pre-wrap; font-size: 13px; }
        .msg.self .msg-bubble { background: var(--accent-dim); border-color: var(--accent-dim); color: var(--text-hi); }
        
        /* Вложения */
        .msg-attachments { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
        .msg-attachment { display: flex; gap: 8px; align-items: center; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius); padding: 8px; font-size: 12px; cursor: pointer; }
        .msg-attachment img { max-width: 100%; max-height: 200px; border-radius: var(--radius); }

        .msg-actions { display: flex; gap: 4px; opacity: 0; transition: 0.15s; margin-top: 2px; }
        .msg:hover .msg-actions { opacity: 1; }
        .msg-action { font-size: 10px; color: var(--text-dim); padding: 2px 6px; border-radius: 3px; }
        .msg-action:hover { background: var(--bg3); color: var(--accent); }

        /* --- ВВОД СООБЩЕНИЯ --- */
        .composer { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--bg2); position: relative; }
        .composer input[type=text] { flex: 1; border-radius: 20px; }
        .composer .icon-btn { width: 38px; height: 38px; }
        .composer-reply-bar { position: absolute; top: -45px; left: 0; right: 0; background: var(--bg3); padding: 8px 16px; display: flex; align-items: center; gap: 10px; }

        /* --- АДМИНКА --- */
        .admin-panel { background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .admin-header { display: flex; justify-content: space-between; padding: 14px; border-bottom: 1px solid var(--border); color: var(--accent); font-weight: bold; }
        .admin-tabs { display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; }
        .admin-tab { flex: 1; padding: 10px; font-size: 11px; color: var(--text-dim); white-space: nowrap; border-bottom: 2px solid transparent; }
        .admin-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .admin-content { flex: 1; overflow-y: auto; padding: 12px; }

        /* --- МОДАЛКИ --- */
        .modal-root { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); padding: 20px; }
        .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-lg); width: min(500px, 100%); max-height: 85vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
        .modal-title { color: var(--accent); font-weight: bold; text-transform: uppercase; font-size: 13px; }
        .modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .modal-body label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; display: block; }
        .modal-body input, .modal-body select, .modal-body textarea { width: 100%; }
        .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
        .modal-user-row { display: flex; align-items: center; gap: 10px; padding: 8px; background: var(--bg3); border-radius: var(--radius); cursor: pointer; margin-bottom: 4px; }
        .modal-user-row:hover { background: var(--bg4); }

        /* --- КОНТЕКСТНОЕ МЕНЮ --- */
        .context-menu { position: fixed; background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,0.5); padding: 4px; z-index: 400; min-width: 160px; }
        .context-item { padding: 8px 12px; font-size: 12px; cursor: pointer; border-radius: 3px; display: flex; gap: 8px; }
        .context-item:hover { background: var(--bg4); color: var(--accent); }
        .context-item.danger { color: var(--danger); }

        /* --- УВЕДОМЛЕНИЯ --- */
        .toast-root { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 300; }
        .toast { background: var(--bg2); border: 1px solid var(--border2); border-left: 3px solid var(--accent); padding: 10px 16px; border-radius: var(--radius); font-size: 12px; animation: slidein 0.3s; }
        .toast.error { border-left-color: var(--danger); }
        .toast.warn { border-left-color: var(--warn); }
        @keyframes slidein { from { transform: translateX(100%); opacity: 0; } }

        [hidden] { display: none !important; }
    </style>
</head>
<body>

    <!-- ============================================================
         ЭКРАН ЛОГИНА

         ОСНОВНОЕ ПРИЛОЖЕНИЕ
         ============================================================ -->

        <!-- САЙДБАР -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <div class="brand">SCP<span class="brand-dot">●</span></div>
                <div class="sidebar-actions">
                    <button id="btn-new-chat" class="icon-btn" title="Новый чат">➕</button>
                    <button id="btn-admin" class="icon-btn" title="Админка" hidden>🛡</button>

    <!-- ============================================================
         JAVASCRIPT
         ============================================================ -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // --- УТИЛИТЫ И ГЛОБАЛЬНОЕ СОСТОЯНИЕ ---
        const $ = s => document.querySelector(s);
        const $$ = s => Array.from(document.querySelectorAll(s));
        
        const state = {
            me: null, chats: [], contacts: [], activeChatId: null, messages: [],
            socket: null, adminOpen: false, dmKeys: new Map(), replyTo: null,
            onlineUsers: new Set(), users_cache: new Map()
        };

        const CLEARANCE_NAMES = { 1: 'Класс-D', 2: 'Научный', 3: 'Старший', 4: 'Руководитель', 5: 'Совет О5' };
        const ROLE_TO_CLEARANCE = { user: 1, helper: 5, moderator: 5, admin: 5, sysadmin: 5 };

        // Возвращает правильный уровень (исправляет баг с L1 у админов)
        function getUserClearance(u) {
            if (!u) return 1;
            return Math.max(u.clearance_level || 1, ROLE_TO_CLEARANCE[u.role] || 1);
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function el(tag, attrs, ...children) {
            const e = document.createElement(tag);
            if (attrs) {
                for (const [k, v] of Object.entries(attrs)) {
                    if (v == null || v === false) continue;
                    if (k === 'class') e.className = v;
                    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
                    else if (k === 'html') e.innerHTML = v;
                    else if (k === 'text') e.textContent = v;
                    else e.setAttribute(k, v);
                }
            }
            children.flat(Infinity).forEach(c => {
                if (c != null && c !== false) e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
            });
            return e;
        }

        function toast(text, type = 'info', ms = 3000) {
            const root = $('#toast-root');
            if (!root) return;
            const t = el('div', { class: 'toast ' + type, text });
            root.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, ms);
        }

        async function api(url, opts = {}) {
            const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
            const resp = await fetch(url, { credentials: 'include', ...opts, headers });
            let data = null;
            try { data = await resp.json(); } catch (e) {}
            if (!resp.ok) {
                const err = new Error((data && data.error) || `HTTP ${resp.status}`);
                err.status = resp.status;
                throw err;
            }
            return data;
        }

        function fmtTime(ts) { return ts ? new Date(ts * 1000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : ''; }
        function b64(arr) { let s = ''; for (let i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]); return btoa(s); }

        // --- ШИФРОВАНИЕ (E2EE) ---
        async function getDMKey(chat) {
            if (!chat || chat.isGroup || chat.isHelper || chat.isSelf) return null;
            const otherId = chat.otherUserId;
            if (!otherId || !state.me || !state.me.id) return null; // Защита от ошибки "Не удалось расшифровать"
            
            if (state.dmKeys.has(chat.id)) return state.dmKeys.get(chat.id);
            const ids = [state.me.id, otherId].sort().join('|');
            const enc = new TextEncoder();
            const baseKey = await crypto.subtle.importKey('raw', enc.encode('scp-e2ee-v1:' + ids), 'PBKDF2', false, ['deriveKey']);
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: enc.encode('scp-foundation-e2ee'), iterations: 100000, hash: 'SHA-256' },
                baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
            );
            state.dmKeys.set(chat.id, key);
            return key;
        }

        async function encryptText(key, text) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
            const combined = new Uint8Array(iv.length + ct.byteLength);
            combined.set(iv, 0);
            combined.set(new Uint8Array(ct), iv.length);
            return b64(combined);
        }

        async function decryptText(key, b64str) {
            try {
                const data = Uint8Array.from(atob(b64str), c => c.charCodeAt(0));
                const iv = data.slice(0, 12), ct = data.slice(12);
                const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
                return new TextDecoder().decode(pt);
            } catch (e) { return null; }
        }

        async function decryptIncoming(chat, msg) {
            if (!msg || !msg.is_encrypted) return msg;
            if (chat.isSelf || chat.isGroup || chat.isHelper) return msg;
            
            try {
                const key = await getDMKey(chat);
                if (!key) return { ...msg, text: '[🔒 Нет ключа]', _undecryptable: true };
                
                const plain = await decryptText(key, msg.text);
                if (plain === null) return { ...msg, text: '[🔒 Ошибка дешифровки]', _undecryptable: true };
                
                try {
                    return { ...msg, text: JSON.parse(plain).text || '', _meta: JSON.parse(plain), _decrypted: true };
                } catch (e) {
                    return { ...msg, text: plain, _decrypted: true };
                }
            } catch (e) {
                return { ...msg, text: '[🔒 Системная ошибка]', _undecryptable: true };
            }
        }

        // --- ИНИЦИАЛИЗАЦИЯ ---
        async function init() {
            bindEvents();
            try {
                state.me = await api('/api/me');
            } catch (e) {
                if (e.status === 403) $('#login-error').textContent = 'Забанен';
                showLogin();
                return;
            }
            hideLogin();
            await Promise.all([loadChats(), loadContacts()]);
            renderMe();
            connectSocket();
        }

        function showLogin() { $('#login-screen').style.display = 'flex'; $('#app').hidden = true; }
        function hideLogin() { $('#login-screen').style.display = 'none'; $('#app').hidden = false; }

        function renderMe() {
            if (!state.me) return;
            const lvl = getUserClearance(state.me);
            const name = CLEARANCE_NAMES[lvl] || 'Класс-D';
            
            // Показываем правильный уровень (L5 для админа)
            $('#me-info').innerHTML = `
                <div class="me-avatar">
                    ${state.me.avatarUrl ? `<img src="${state.me.avatarUrl}">` : state.me.username[0].toUpperCase()}
                </div>
                <div>
                    <div class="me-name">${escapeHtml(state.me.displayName || state.me.username)}</div>
                    <div class="me-sub">L${lvl} · ${name} · ${state.me.xp || 0} XP</div>
                </div>
            `;
            // Кнопка админки для модеров и выше
            if (['helper', 'moderator', 'admin', 'sysadmin'].includes(state.me.role)) {
                $('#btn-admin').hidden = false;
            }
        }

        // --- SOCKET.IO ---
        function connectSocket() {
            state.socket = io({ withCredentials: true });
            state.socket.on('newMessage', async p => {
                const c = state.chats.find(x => x.id === p.chatId);
                if (!c) return;
                const m = await decryptIncoming(c, p);
                c.lastMessage = m;
                if (c.id === state.activeChatId) {
                    if (!state.messages.find(x => x.id === m.id)) state.messages.push(m);
                    renderMessages();
                    if (!document.hidden) markRead(c.id);
                } else {
                    c.unreadCount = (c.unreadCount || 0) + 1;
                }
                renderChatList();
            });
            state.socket.on('refreshData', async () => { await loadChats(); await loadContacts(); });
            state.socket.on('messageDeleted', ({ messageId, type }) => {
                if (type === 'all') state.messages = state.messages.filter(m => m.id !== messageId);
                else { const m = state.messages.find(x => x.id === messageId); if (m) m._deletedForMe = true; }
                renderMessages();
            });
        }

        // --- ЧАТЫ ---
        async function loadChats() { state.chats = await api('/api/chats'); renderChatList(); }
        async function loadContacts() { state.contacts = await api('/api/users/contacts'); renderContactList(); }

        function renderChatList() {
            const list = $('#chat-list');
            if (!list) return;
            list.innerHTML = '';
            state.chats.forEach(c => {
                const item = el('div', { class: 'chat-item' + (c.id === state.activeChatId ? ' active' : ''), onclick: () => openChat(c.id) });
                const av = el('div', { class: 'chat-item-avatar' }, c.avatarUrl ? el('img', { src: c.avatarUrl }) : (c.name || '?')[0].toUpperCase());
                if (state.onlineUsers.has(c.otherUserId)) av.appendChild(el('div', { class: 'online-dot' }));
                
                const body = el('div', { class: 'chat-item-body' }, 
                    el('div', { class: 'chat-item-name' }, c.name || '?'),
                    el('div', { class: 'chat-item-preview' }, c.lastMessage ? (c.lastMessage.is_encrypted ? '🔒 Зашифровано' : (c.lastMessage.text || '[Файл]').slice(0, 40)) : 'Нет сообщений')
                );
                item.append(av, body);
                if (c.unreadCount) item.appendChild(el('div', { class: 'chat-item-badge' }, c.unreadCount));
                list.appendChild(item);
            });

        function renderContactList() {
            const list = $('#contact-list');
            if (!list) return;
            list.innerHTML = '';
            state.contacts.forEach(u => {
                const item = el('div', { class: 'chat-item', onclick: async () => {
                    const c = await api('/api/chats', { method: 'POST', body: JSON.stringify({ userId: u.id }) });
                    await loadChats();
                    openChat(c.id);
                }});
                item.append(
                    el('div', { class: 'chat-item-avatar' }, (u.displayName || u.username)[0].toUpperCase()),
                    el('div', { class: 'chat-item-body' }, 
                        el('div', { class: 'chat-item-name' }, u.displayName || u.username),
                        el('div', { class: 'chat-item-preview' }, `@${u.username} · L${getUserClearance(u)}`)
                    )
                );
                list.appendChild(item);
            });
        }

        async function openChat(id) {
            state.activeChatId = id;
            state.replyTo = null;
            state.editingMessage = null;
            $('#chat-empty').hidden = true;
            $('#chat-view').hidden = false;
            $('#composer-reply-bar').hidden = true;
            
            const c = state.chats.find(x => x.id === id);
            if (!c) return;
            
            $('#chat-name').textContent = c.name;
            $('#chat-sub').textContent = c.isGroup ? 'Группа' : (c.isSelf ? 'Избранное' : 'Личный E2EE');
            $('#chat-avatar').innerHTML = c.avatarUrl ? `<img src="${c.avatarUrl}">` : c.name[0].toUpperCase();
            
            const raw = await api(`/api/chats/${id}/messages`);
            state.messages = [];
            for (const m of raw) {
                state.messages.push(await decryptIncoming(c, m));
            }
            renderMessages();
            markRead(id);
            c.unreadCount = 0;
            renderChatList();
            $('#msg-input').focus();
        }

        async function markRead(id) {
            try { await api(`/api/chats/${id}/mark-read`, { method: 'POST' }); } catch (e) {}
        }

        // --- ОТРИСОВКА СООБЩЕНИЙ ---
        function renderMessages() {
            const box = $('#messages');
            if (!box) return;
            box.innerHTML = '';
            state.messages.forEach(m => {
                if (m._deletedForMe) return;
                box.appendChild(renderMessageEl(m));
            });
            box.scrollTop = box.scrollHeight;
        }

        function renderMessageEl(m) {
            const me = state.me;
            const isSelf = m.sender?.id === me.id;
            const isAnon = m.is_anonymous || m.sender?.is_anonymous;
            const cls = 'msg' + (isSelf ? ' self' : '') + (isAnon ? ' anon' : '') + (m.is_deleted ? ' deleted' : '');
            
            const wrap = el('div', { class: cls, dataset: { id: m.id } });
            
            // Аватарка (клик открывает профиль)
            const av = el('div', { class: 'msg-avatar', onclick: () => m.sender?.id && openUserProfile(m.sender.id) },
                isAnon ? '🕵' : (m.sender?.avatarUrl ? el('img', { src: m.sender.avatarUrl }) : ((m.sender?.displayName || m.sender?.username || '?')[0].toUpperCase()))
            );
            
            const body = el('div', { class: 'msg-body' });
            const header = el('div', { class: 'msg-header' });
            
            // Плашка роли
            if (m.sender?.role && m.sender.role !== 'user' && !isAnon) {
                header.appendChild(el('span', {
                    style: 'color:var(--warn);font-size:9px;background:var(--bg3);border:1px solid var(--border2);padding:0 4px;border-radius:3px;margin-right:4px',
                    text: m.sender.role.toUpperCase()
                }));
            }
            
            header.appendChild(el('span', { class: 'msg-sender', text: m.sender?.displayName || m.sender?.username || '?' }));
            header.appendChild(el('span', { class: 'msg-time', text: fmtTime(m.createdAt) }));
            if (m.is_encrypted && !m._undecryptable) header.appendChild(el('span', { text: '🔒', style: 'font-size:10px' }));
            
            const bubble = el('div', { class: 'msg-bubble' });
            if (m.is_deleted) {
                bubble.innerHTML = '<em>[удалено]</em>';
            } else {
                let t = escapeHtml(m.text || '');
                t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
                bubble.innerHTML = t;
            }
            
            // Вложения
            if (m.attachments?.length) {
                const aBox = el('div', { class: 'msg-attachments' });
                m.attachments.forEach(a => {
                    const aw = el('div', { class: 'msg-attachment', onclick: () => downloadAttachment(a) });
                    if (a.mime?.startsWith('image/') && !a.is_encrypted) aw.appendChild(el('img', { src: a.url }));
                    else aw.innerHTML = `<span>${a.is_encrypted ? '🔐' : '📄'}</span><span>${escapeHtml(a.name)}</span>`;
                    aBox.appendChild(aw);
                });
                bubble.appendChild(aBox);
            }
            
            body.append(header, bubble);
            
            // Кнопки действий
            const acts = el('div', { class: 'msg-actions' });
            if (!m.is_deleted) {
                acts.appendChild(el('button', { class: 'msg-action', text: '↩', onclick: () => {
                    state.replyTo = m;
                    $('#composer-reply-bar').hidden = false;
                    $('#reply-text').textContent = 'Ответ: ' + (m.text || '').slice(0, 30);
                }}));
                
                // Удаление
                if (isSelf || ['admin', 'sysadmin', 'moderator'].includes(me.role)) {
                    acts.appendChild(el('button', { class: 'msg-action', text: '🗑', onclick: async () => {
                        if (confirm('Удалить?')) {
                            await api(`/api/messages/${m.id}`, { method: 'DELETE', body: JSON.stringify({ scope: 'all' }) });
                            state.messages = state.messages.filter(x => x.id !== m.id);
                            renderMessages();
                        }
                    }}));
                }
            }
            body.appendChild(acts);
            
            wrap.append(av, body);
            return wrap;
        }

        async function downloadAttachment(a) {
            try {
                if (a.is_encrypted && a.enc_meta) {
                    const r = await fetch(a.url, { credentials: 'include' });
                    const b = await r.arrayBuffer();
                    const k = Uint8Array.from(atob(a.enc_meta.key), c => c.charCodeAt(0));
                    const iv = Uint8Array.from(atob(a.enc_meta.iv), c => c.charCodeAt(0));
                    const ko = await crypto.subtle.importKey('raw', k, { name: 'AES-GCM' }, false, ['decrypt']);
                    const d = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, ko, b);
                    const url = URL.createObjectURL(new Blob([d], { type: a.enc_meta.originalType }));
                    const link = document.createElement('a');
                    link.href = url; link.download = a.enc_meta.originalName; link.click();
                } else {
                    window.open(a.url, '_blank');
                }
            } catch (e) { toast('Ошибка скачивания', 'error'); }
        }

        // --- ОТПРАВКА ---
        async function sendMessage(text) {
            if (!text.trim() || !state.activeChatId) return;
            const c = state.chats.find(x => x.id === state.activeChatId);
            if (!c) return;
            
            let payload = text, encrypted = false;
            if (!c.isGroup && !c.isHelper) {
                const k = await getDMKey(c);
                if (k) { payload = await encryptText(k, text); encrypted = true; }
            }
            
            try {
                const r = await api(`/api/chats/${c.id}/messages`, {
                    method: 'POST',
                    body: JSON.stringify({ text: payload, is_encrypted: encrypted, reply_to: state.replyTo?.id })
                });
                const m = await decryptIncoming(c, r);
                state.messages.push(m);
                renderMessages();
                state.replyTo = null;
                $('#composer-reply-bar').hidden = true;
            } catch (e) { toast(e.message, 'error'); }
        }

        async function sendFile(f) {
            const c = state.chats.find(x => x.id === state.activeChatId);
            if (!c) return;
            // Упрощенная отправка без E2EE для файлов, чтобы не ломать S3
            try {
                const u = await api(`/api/chats/${c.id}/get-upload-url`, {
                    method: 'POST', body: JSON.stringify({ fileName: f.name, fileType: f.type || 'application/octet-stream', fileSize: f.size })
                });
                await fetch(u.uploadUrl, { method: 'PUT', body: f, headers: { 'Content-Type': f.type } });
                const conf = await api(`/api/chats/${c.id}/confirm-upload`, {
                    method: 'POST', body: JSON.stringify({ files: [{ key: u.key, type: f.type, name: f.name, size: f.size }] })
                });
                state.messages.push(await decryptIncoming(c, conf));
                renderMessages();
            } catch (e) { toast(e.message, 'error'); }
        }

        // --- ГОЛОСОВЫЕ ---
        async function startVoice() {
            try {
                const s = await navigator.mediaDevices.getUserMedia({ audio: true });
                const r = new MediaRecorder(s), ch = [];
                r.ondataavailable = e => ch.push(e.data);
                state.voiceState = { recorder: r, stream: s, chunks: ch, startTime: Date.now(), timerId: null };
                r.start();
                $('#voice-overlay').hidden = false;
                state.voiceState.timerId = setInterval(() => {
                    const sec = Math.floor((Date.now() - state.voiceState.startTime) / 1000);
                    $('#voice-timer').textContent = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
                }, 200);
            } catch (e) { toast('Нет микрофона', 'error'); }
        }

        async function stopVoice() {
            const vs = state.voiceState;
            if (!vs) return;
            clearInterval(vs.timerId);
            vs.recorder.onstop = async () => {
                vs.stream.getTracks().forEach(t => t.stop());
                $('#voice-overlay').hidden = true;
                const b = new Blob(vs.chunks, { type: 'audio/webm' });
                state.voiceState = null;
                if (b.size < 1000) return toast('Слишком коротко', 'warn');
                
                const c = state.chats.find(x => x.id === state.activeChatId);
                try {
                    const u = await api(`/api/chats/${c.id}/get-upload-url`, { method: 'POST', body: JSON.stringify({ fileName: 'voice.webm', fileType: 'audio/webm', fileSize: b.size }) });
                    await fetch(u.uploadUrl, { method: 'PUT', body: b, headers: { 'Content-Type': 'audio/webm' } });
                    const conf = await api(`/api/chats/${c.id}/confirm-upload`, { method: 'POST', body: JSON.stringify({ files: [{ key: u.key, type: 'audio/webm', name: 'voice.webm', size: b.size }], is_voice: true }) });
                    state.messages.push(await decryptIncoming(c, conf));
                    renderMessages();
                } catch (e) { toast('Ошибка', 'error'); }
            };
            vs.recorder.stop();
        }

        // --- АДМИНКА ---
        async function toggleAdmin() {
            state.adminOpen = !state.adminOpen;
            $('#admin-panel').hidden = !state.adminOpen;
            $('#app').classList.toggle('admin-open', state.adminOpen);
            if (state.adminOpen) loadAdminTab('users');
        }

        async function loadAdminTab(t) {
            $('#admin-content').innerHTML = 'Загрузка...';
            if (t === 'users') {
                const u = await api('/api/admin/users-list');
                $('#admin-content').innerHTML = u.map(x => `
                    <div class="admin-row" style="background:var(--bg3);padding:10px;margin-bottom:4px;border-radius:4px">
                        <div style="font-weight:bold">@${x.username} ${x.ban_expires ? '🚫' : ''}</div>
                        <div style="font-size:11px;color:var(--text-dim)">L${getUserClearance(x)} · ${x.role}</div>
                    </div>
                `).join('');
            } else {
                $('#admin-content').innerHTML = 'В разработке...';
            }
        }

        // --- СОБЫТИЯ ---
        function bindEvents() {
            // Логин
            $$('.login-tab').forEach(t => t.onclick = () => {
                $$('.login-tab').forEach(x => x.classList.remove('active')); t.classList.add('active');
                $('#login-form').hidden = t.dataset.tab !== 'login';
                $('#register-form').hidden = t.dataset.tab !== 'register';
            });
            $('#login-form').onsubmit = async e => {
                e.preventDefault();
                try { await api('/api/login', { method: 'POST', body: JSON.stringify({ username: $('#login-username').value, password: $('#login-password').value }) }); location.reload(); }
                catch (err) { $('#login-error').textContent = err.message; }
            };
            
            // Кнопки
            $('#btn-new-chat').onclick = openNewChatModal;
            $('#btn-settings').onclick = openSettings;
            $('#btn-admin').onclick = toggleAdmin;
            $('#btn-admin-close').onclick = toggleAdmin;
            
            // Чат
            $('#btn-send').onclick = () => { const v = $('#msg-input').value; if (v.trim()) { $('#msg-input').value = ''; sendMessage(v); } };
            $('#msg-input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#btn-send').click(); } };
            $('#btn-attach').onclick = () => { const i = $('#file-input'); i.value = ''; i.onchange = () => { if (i.files[0]) sendFile(i.files[0]); }; i.click(); };
            $('#btn-mic').onclick = startVoice;
            $('#btn-voice-cancel').onclick = () => { state.voiceState?.stream.getTracks().forEach(t => t.stop()); $('#voice-overlay').hidden = true; state.voiceState = null; };
            $('#btn-voice-stop').onclick = stopVoice;
            $('#btn-chat-menu').onclick = openChatMenu;
            $('#btn-poll').onclick = openPollModal;
            $('#btn-chat-info').onclick = () => { const c = state.chats.find(x => x.id === state.activeChatId); if (c && c.otherUserId) openUserProfile(c.otherUserId); };
            $('#btn-cancel-reply').onclick = () => { state.replyTo = null; $('#composer-reply-bar').hidden = true; };
            
            // Табы
            $$('.tab-btn').forEach(t => t.onclick = () => {
                $$('.tab-btn').forEach(x => x.classList.remove('active')); t.classList.add('active');
                $('#chat-list').hidden = t.dataset.tab !== 'chats';
                $('#contact-list').hidden = t.dataset.tab !== 'contacts';
            });
        }

        // СТАРТ
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    </script>
</body>
</html>
