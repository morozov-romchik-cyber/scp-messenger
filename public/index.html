<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%230a0e0a' width='100' height='100'/%3E%3Ctext x='50' y='70' font-size='54' text-anchor='middle' fill='%2344cc44' font-family='monospace' font-weight='bold'%3ESCP%3C/text%3E%3C/svg%3E">

<style>
/* ==========================================================================
   SCP FOUNDATION SECURE TERMINAL — STYLESHEET
   Version: 3.1 COMPLETE
   Содержит:
   - Reset / normalize
   - CSS variables + 3 темы
   - Полная типизация и утилиты
   - Login screen
   - App layout (sidebar / chat / admin)
   - Chat list / contacts
   - Messages (bubbles, replies, reactions, attachments, polls, edits)
   - Composer
   - Admin panel (все вкладки)
   - Modals (12+ штук)
   - Toast / alerts
   - Voice recorder с waveform
   - Emoji picker
   - Image lightbox
   - Context menus
   - Scroll indicators
   - Responsive (3 breakpoints)
   - Print
   ========================================================================== */

/* ========== RESET / NORMALIZE ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overscroll-behavior:none;overscroll-behavior-y:contain}
body{height:100%;font-family:'Courier New',Consolas,'Lucida Console',monospace;background:#0a0e0a;color:#c8d4c8;font-size:14px;overflow:hidden;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit;outline:none;transition:all .15s ease}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;background:#171e17;border:1px solid #2a352a;padding:8px 12px;border-radius:4px;outline:none;transition:border-color .15s ease,box-shadow .15s ease}
input:focus,select:focus,textarea:focus{border-color:#44cc44;box-shadow:0 0 0 2px #44cc4422}
input::placeholder,textarea::placeholder{color:#4a5a4a}
textarea{resize:vertical;min-height:60px;font-family:inherit}
a{color:#44cc44;text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:#2a662a;color:#e8f4e8}
img{max-width:100%;display:block}
audio,video{max-width:100%}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#0a0e0a}
::-webkit-scrollbar-thumb{background:#3a4a3a;border-radius:4px;transition:background .15s ease}
::-webkit-scrollbar-thumb:hover{background:#2a662a}
*{scrollbar-width:thin;scrollbar-color:#3a4a3a #0a0e0a}

/* ========== CSS VARIABLES ========== */
:root{
--bg:#0a0e0a;--bg2:#111611;--bg3:#171e17;--bg4:#1f281f;--bg5:#263026;
--border:#2a352a;--border2:#3a4a3a;--border3:#4a5a4a;
--text:#c8d4c8;--text-dim:#6a7a6a;--text-dimmer:#4a5a4a;--text-hi:#e8f4e8;
--accent:#44cc44;--accent-dim:#2a662a;--accent-bright:#66ff66;--accent-glow:#44cc4488;--accent-faint:#44cc4422;
--danger:#cc4444;--danger-dim:#661a1a;--danger-glow:#cc444466;
--warn:#ccaa44;--warn-dim:#665522;
--info:#4488cc;--info-dim:#1a4466;
--success:#44cc44;--black:#000;--white:#fff;
--radius-sm:3px;--radius:6px;--radius-lg:10px;--radius-xl:14px;--radius-2xl:20px;
--font:'Courier New',Consolas,'Lucida Console',monospace;
--font-mono:'Courier New',monospace;
--shadow-sm:0 1px 4px rgba(0,0,0,.4);
--shadow:0 4px 16px rgba(0,0,0,.5);
--shadow-lg:0 8px 40px rgba(0,0,0,.7);
--glow:0 0 20px var(--accent-glow);
--glow-danger:0 0 20px var(--danger-glow);
--z-sidebar:10;--z-admin:20;--z-modal:100;--z-voice:200;--z-alert:250;--z-toast:300;--z-context:400;--z-lightbox:500;
}

/* ========== ТЕМА: LIGHT ========== */
body.theme-light{
--bg:#f4f6f4;--bg2:#ffffff;--bg3:#e8ece8;--bg4:#dce4dc;--bg5:#d0d8d0;
--border:#c8d0c8;--border2:#b0bcb0;--border3:#98a898;
--text:#1a221a;--text-dim:#4a5a4a;--text-dimmer:#6a7a6a;--text-hi:#000;
--accent:#228822;--accent-dim:#b8e8b8;--accent-bright:#006600;--accent-glow:#22882244;
--danger:#cc2222;--danger-dim:#ffdddd;--warn:#aa8800;--warn-dim:#ffeebb;
}

/* ========== ТЕМА: AMBER ========== */
body.theme-amber{
--bg:#0e0a05;--bg2:#181208;--bg3:#221a0e;--bg4:#2e2416;--bg5:#3a2e1e;
--border:#3a2e1e;--border2:#4a3a26;--border3:#5a4a30;
--text:#d4c8a8;--text-dim:#8a7a5a;--text-dimmer:#5a4a30;--text-hi:#f4e8c8;
--accent:#ddaa22;--accent-dim:#665510;--accent-bright:#ffcc44;--accent-glow:#ddaa2266;
--danger:#cc4422;--danger-dim:#662210;--warn:#ddaa22;--warn-dim:#665510;
}

/* ========== ТЕМА: CYBER ========== */
body.theme-cyber{
--bg:#050a0e;--bg2:#0a1218;--bg3:#0e1a22;--bg4:#16222e;--bg5:#1e2e3a;
--border:#1e2e3a;--border2:#2a3e4a;--border3:#3a4e5a;
--text:#a8c8d4;--text-dim:#5a7a8a;--text-dimmer:#3a5a6a;--text-hi:#d8f0ff;
--accent:#22ccdd;--accent-dim:#116677;--accent-bright:#44eeff;--accent-glow:#22ccdd88;
--danger:#dd2266;--danger-dim:#661133;--warn:#ddaa22;--warn-dim:#665510;
}

/* ========== LOGIN ========== */
.login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#0f160f 0%,#050705 100%);z-index:1000;padding:20px}
.login-screen::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent 0,transparent 2px,#44cc4404 2px,#44cc4404 3px),repeating-linear-gradient(90deg,transparent 0,transparent 2px,#44cc4404 2px,#44cc4404 3px);pointer-events:none;animation:scanlines 8s linear infinite}
@keyframes scanlines{0%{background-position:0 0,0 0}100%{background-position:0 100px,100px 0}}
.login-box{position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px 32px;width:min(440px,100%);text-align:center;box-shadow:var(--glow),var(--shadow-lg);animation:loginAppear .6s ease}
@keyframes loginAppear{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.login-logo{font-size:72px;font-weight:900;color:var(--accent);letter-spacing:10px;text-shadow:0 0 30px var(--accent-glow),0 0 60px var(--accent-glow);line-height:1;margin-bottom:8px;animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{text-shadow:0 0 30px var(--accent-glow),0 0 60px var(--accent-glow)}50%{text-shadow:0 0 40px var(--accent-glow),0 0 80px var(--accent-glow),0 0 120px var(--accent-glow)}}
.login-sub{color:var(--text-dim);font-size:11px;letter-spacing:4px;margin-bottom:32px;text-transform:uppercase}
.login-tabs{display:flex;margin-bottom:24px;border-bottom:1px solid var(--border)}
.login-tab{flex:1;padding:12px;color:var(--text-dim);font-size:12px;letter-spacing:2px;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;text-transform:uppercase}
.login-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.login-tab:hover:not(.active){color:var(--text)}
.login-form{display:flex;flex-direction:column;gap:12px}
.login-form input{text-align:center;padding:12px 16px;font-size:14px;letter-spacing:1px}
.login-form input:focus{border-color:var(--accent)}
.login-error{color:var(--danger);font-size:12px;min-height:18px;text-align:center;line-height:1.3}
.login-error:not(:empty){padding:8px;background:var(--danger-dim);border-radius:var(--radius-sm);animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pwd-strength{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:4px}
.pwd-strength-bar{height:100%;width:0;transition:width .3s ease,background .3s ease}

/* ========== BUTTONS ========== */
.btn-primary{background:var(--accent-dim);color:var(--text-hi);padding:12px 20px;border:1px solid var(--accent);border-radius:var(--radius-sm);font-weight:bold;letter-spacing:2px;text-transform:uppercase;font-size:12px;transition:all .15s ease}
.btn-primary:hover:not(:disabled){background:var(--accent);color:var(--bg);box-shadow:var(--glow)}
.btn-primary:active:not(:disabled){transform:scale(.98)}
.btn-secondary{background:var(--bg3);color:var(--text);padding:10px 16px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:12px}
.btn-secondary:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger-dim);color:var(--text-hi);padding:10px 16px;border:1px solid var(--danger);border-radius:var(--radius-sm);font-size:12px}
.btn-danger:hover:not(:disabled){background:var(--danger);color:var(--bg)}
.btn-ghost{background:none;color:var(--text-dim);padding:8px 12px;border-radius:var(--radius-sm);font-size:12px}
.btn-ghost:hover{color:var(--accent);background:var(--bg3)}

/* ========== ICON BUTTONS ========== */
.icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);color:var(--text-dim);font-size:16px;transition:all .15s ease;position:relative}
.icon-btn:hover{background:var(--bg3);color:var(--accent)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.primary{background:var(--accent-dim);color:var(--text-hi)}
.icon-btn.primary:hover{background:var(--accent);color:var(--bg);box-shadow:var(--glow)}
.icon-btn.active{color:var(--accent)}
.icon-btn.danger{color:var(--danger)}
.icon-btn.danger:hover{background:var(--danger-dim)}
.icon-btn.sm{width:28px;height:28px;font-size:14px}
.icon-btn.lg{width:42px;height:42px;font-size:20px}

/* ========== APP LAYOUT ========== */
.app{display:grid;grid-template-columns:320px 1fr;height:100vh;transition:grid-template-columns .2s ease}
.app.admin-open{grid-template-columns:320px 1fr 420px}

/* ========== SIDEBAR ========== */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.brand{font-weight:900;font-size:20px;color:var(--accent);letter-spacing:2px;text-shadow:0 0 10px var(--accent-glow)}
.brand-dot{color:var(--danger);font-size:10px;vertical-align:super;margin-left:3px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sidebar-actions{display:flex;gap:4px}
.sidebar-search{padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-search input{width:100%;font-size:12px;padding:8px 12px;border-radius:var(--radius-2xl)}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab-btn{flex:1;padding:10px;font-size:11px;color:var(--text-dim);letter-spacing:1px;border-bottom:2px solid transparent;margin-bottom:-1px;text-transform:uppercase}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover:not(.active){color:var(--text)}
.chat-list{flex:1;overflow-y:auto;padding:4px;min-height:0}
.chat-item{padding:10px 12px;border-radius:var(--radius);cursor:pointer;display:flex;gap:10px;align-items:center;transition:background .1s ease;position:relative;overflow:hidden}
.chat-item:hover{background:var(--bg3)}
.chat-item.active{background:var(--bg4);border-left:3px solid var(--accent);padding-left:9px}
.chat-item.unread .chat-item-name{color:var(--text-hi);font-weight:bold}
.chat-item-avatar{width:44px;height:44px;border-radius:50%;background:var(--bg4);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;color:var(--accent);overflow:hidden;border:1px solid var(--border2);position:relative}
.chat-item-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.chat-item-avatar .online-dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg2)}
.chat-item-body{flex:1;min-width:0}
.chat-item-name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.chat-item-preview{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;font-style:italic}
.chat-item-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:10px;color:var(--text-dim);flex-shrink:0}
.chat-item-badge{background:var(--accent);color:var(--bg);padding:1px 6px;border-radius:8px;font-weight:bold;font-size:10px;min-width:18px;text-align:center}
.chat-item-pin{font-size:11px;color:var(--warn)}
.chat-item-icon{font-size:11px;color:var(--accent-dim)}
.sidebar-footer{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s ease;flex-shrink:0}
.sidebar-footer:hover{background:var(--bg3)}
.me-info{display:flex;align-items:center;gap:10px;width:100%;min-width:0}
.me-avatar{width:38px;height:38px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-weight:bold;color:var(--accent);flex-shrink:0;overflow:hidden;border:1px solid var(--border2);font-size:15px;position:relative}
.me-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.me-avatar .online-dot{position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg2)}
.me-body{flex:1;min-width:0}
.me-name{font-size:12px;color:var(--text-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold}
.me-sub{font-size:10px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* ========== CHAT AREA ========== */
.chat-area{background:var(--bg);display:flex;flex-direction:column;min-width:0;position:relative;overflow:hidden}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-dim);gap:12px;position:relative}
.chat-empty::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,transparent 0%,var(--bg) 70%);pointer-events:none}
.chat-empty-logo{font-size:120px;font-weight:900;color:var(--bg3);letter-spacing:12px;text-shadow:0 0 40px var(--accent-dim);animation:logoBreath 4s ease-in-out infinite;position:relative}
@keyframes logoBreath{0%,100%{opacity:.4}50%{opacity:.8}}
.chat-empty-sub{font-size:11px;letter-spacing:6px;color:var(--accent-dim);position:relative}
.chat-empty-hint{font-size:13px;margin-top:20px;position:relative;color:var(--text-dim)}
.chat-view{flex:1;display:flex;flex-direction:column;min-height:0;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.chat-header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.chat-avatar{width:46px;height:46px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;color:var(--accent);overflow:hidden;border:1px solid var(--border2);flex-shrink:0;cursor:pointer}
.chat-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.chat-info{flex:1;min-width:0;cursor:pointer}
.chat-name{font-size:15px;color:var(--text-hi);font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-sub{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-sub.typing{color:var(--accent)}
.chat-actions{display:flex;gap:4px}

/* ========== MESSAGES ========== */
.messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:6px;min-height:0;scroll-behavior:smooth;position:relative}
.msg{display:flex;gap:8px;max-width:75%;align-self:flex-start;animation:fadeInUp .2s ease;position:relative}
@keyframes fadeInUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.self{align-self:flex-end;flex-direction:row-reverse}
.msg.anon .msg-avatar{background:var(--bg3);color:var(--warn);border-color:var(--warn)}
.msg.anon .msg-sender{color:var(--warn);font-style:italic}
.msg.deleted .msg-bubble{opacity:.5;font-style:italic}
.msg.avatar{padding:0;margin:0}
.msg-avatar{width:34px;height:34px;border-radius:50%;background:var(--bg4);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:var(--accent);overflow:hidden;border:1px solid var(--border2);cursor:pointer}
.msg-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.msg-body{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:100%}
.msg-header{display:flex;gap:8px;font-size:10px;align-items:baseline;flex-wrap:wrap}
.msg-sender{color:var(--accent);font-weight:bold;cursor:pointer}
.msg-sender:hover{text-decoration:underline}
.msg-time{color:var(--text-dim)}
.msg-lock{font-size:10px;color:var(--accent-dim);margin-left:4px}
.msg-edited{font-size:9px;color:var(--text-dimmer);margin-left:4px;font-style:italic}
.msg-bubble{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:8px 12px;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;font-size:13px;position:relative;line-height:1.45}
.msg.self .msg-bubble{background:var(--accent-dim);border-color:var(--accent-dim);color:var(--text-hi)}
.msg-bubble strong{color:var(--accent);font-weight:bold}
.msg.self .msg-bubble strong{color:var(--text-hi)}
.msg-bubble em{font-style:italic;color:var(--text-dim)}
.msg-bubble u{text-decoration:underline;text-decoration-color:var(--accent)}
.msg-bubble s{text-decoration:line-through;opacity:.7}
.msg-bubble code{background:var(--bg);padding:1px 5px;border-radius:var(--radius-sm);font-size:12px;color:var(--warn);font-family:var(--font-mono)}
.msg-bubble pre{background:var(--bg);padding:8px;border-radius:var(--radius-sm);overflow-x:auto;margin:4px 0;border-left:2px solid var(--accent-dim)}
.msg-bubble pre code{padding:0;background:none;color:var(--text)}
.msg-bubble blockquote{border-left:3px solid var(--accent-dim);padding-left:10px;margin:4px 0;color:var(--text-dim);font-style:italic}
.msg-bubble .redacted{background:var(--danger);color:transparent;padding:0 6px;border-radius:2px;user-select:none;position:relative;letter-spacing:1px}
.msg-bubble .redacted::before{content:'[ДАННЫЕ УДАЛЕНЫ]';color:var(--white);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:0}
.msg-bubble .spoiler{background:var(--bg3);color:transparent;padding:0 4px;border-radius:2px;cursor:pointer;user-select:none;transition:all .15s ease}
.msg-bubble .spoiler:hover{background:var(--bg4)}
.msg-bubble .spoiler.revealed{background:transparent;color:var(--text);user-select:text}
.msg-bubble .mention{background:var(--accent-dim);color:var(--accent-bright);padding:0 3px;border-radius:2px;font-weight:bold}
.msg.self .msg-bubble .mention{background:var(--accent);color:var(--bg)}
.msg-reply-preview{background:var(--bg);border-left:3px solid var(--accent-dim);border-radius:var(--radius-sm);padding:6px 10px;margin-bottom:4px;cursor:pointer;font-size:11px;max-width:100%;overflow:hidden}
.msg-reply-preview:hover{background:var(--bg3)}
.msg-reply-author{color:var(--accent);font-weight:bold;margin-bottom:2px}
.msg-reply-text{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ========== ATTACHMENTS ========== */
.msg-attachments{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.msg-attachment{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 10px;font-size:12px;cursor:pointer;transition:border-color .15s ease,background .15s ease;max-width:100%;position:relative}
.msg-attachment:hover{border-color:var(--accent);background:var(--bg3)}
.msg-attachment img{max-width:100%;max-height:260px;border-radius:var(--radius-sm);display:block;object-fit:contain}
.msg-attachment audio{max-width:100%}
.msg-attachment-icon{font-size:22px;flex-shrink:0;width:24px;text-align:center}
.msg-attachment-info{flex:1;min-width:0}
.msg-attachment-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-size:12px}
.msg-attachment-size{font-size:10px;color:var(--text-dim);margin-top:2px}
.msg-attachment-enc{color:var(--warn);font-size:10px;margin-left:4px}
.msg-attachment-upload-progress{position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent);transition:width .2s ease}
.voice-waveform{display:flex;align-items:center;gap:2px;height:24px;margin-right:8px}
.voice-waveform-bar{width:2px;background:var(--accent);border-radius:1px;transition:height .1s ease}

/* ========== REACTIONS ========== */
.msg-reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.msg-reaction{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:2px 8px;font-size:12px;cursor:pointer;transition:all .15s ease;display:flex;gap:3px;align-items:center}
.msg-reaction:hover{border-color:var(--accent)}
.msg-reaction.mine{background:var(--accent-dim);border-color:var(--accent)}
.msg-reaction-count{font-size:10px;color:var(--text-dim)}
.msg-reaction.mine .msg-reaction-count{color:var(--text-hi)}

/* ========== POLLS ========== */
.msg-poll{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);padding:10px;margin-top:6px;min-width:240px}
.msg-poll-question{font-weight:bold;margin-bottom:8px;color:var(--text-hi);font-size:13px}
.msg-poll-option{display:block;width:100%;text-align:left;padding:7px 10px;margin-top:4px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;transition:all .15s ease;position:relative;overflow:hidden;color:var(--text)}
.msg-poll-option:hover{border-color:var(--accent)}
.msg-poll-option.voted{background:var(--accent-dim);border-color:var(--accent);color:var(--text-hi)}
.msg-poll-option.correct{background:#2a662a;border-color:var(--accent);color:var(--text-hi)}
.msg-poll-option.wrong{background:#662a2a;border-color:var(--danger);color:var(--text-hi)}
.msg-poll-count{float:right;color:var(--text-dim);font-size:11px}
.msg-poll-total{margin-top:8px;font-size:11px;color:var(--text-dim);text-align:center}

/* ========== MSG ACTIONS ========== */
.msg-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s ease;margin-top:3px;flex-wrap:wrap}
.msg:hover .msg-actions{opacity:1}
.msg.self .msg-actions{justify-content:flex-end}
.msg-action{font-size:10px;color:var(--text-dim);padding:2px 6px;border-radius:var(--radius-sm);background:none;border:none}
.msg-action:hover{background:var(--bg3);color:var(--accent)}
.msg-status{font-size:10px;color:var(--accent-dim);text-align:right;margin-top:2px}
.msg-status.read{color:var(--accent)}

/* ========== COMPOSER ========== */
.composer{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;position:relative}
.composer input[type=text]{flex:1;padding:10px 16px;border-radius:var(--radius-2xl);font-size:13px}
.composer .icon-btn{width:38px;height:38px;flex-shrink:0}
.composer.disabled{opacity:.5;pointer-events:none}
.composer-reply-bar{position:absolute;top:-45px;left:0;right:0;background:var(--bg3);border-top:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:10px;font-size:12px}
.composer-reply-bar-content{flex:1;min-width:0}
.composer-reply-bar-author{color:var(--accent);font-weight:bold;font-size:11px}
.composer-reply-bar-text{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}

/* ========== TYPING ========== */
.typing-indicator{display:flex;gap:4px;align-items:center;padding:4px 8px;font-size:11px;color:var(--text-dim);font-style:italic;min-height:20px}
.typing-dots{display:flex;gap:3px}
.typing-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:typingBounce 1.4s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

/* ========== DATE SEPARATOR ========== */
.date-separator{text-align:center;margin:16px 0 8px;font-size:11px;color:var(--text-dim);position:relative}
.date-separator::before,.date-separator::after{content:'';position:absolute;top:50%;height:1px;background:var(--border);width:calc(50% - 60px)}
.date-separator::before{left:0}
.date-separator::after{right:0}

/* ========== SCROLL-TO-BOTTOM ========== */
.scroll-bottom-btn{position:absolute;bottom:100px;right:24px;width:44px;height:44px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:all .2s ease;z-index:5}
.scroll-bottom-btn.visible{opacity:1;transform:translateY(0)}
.scroll-bottom-btn:hover{background:var(--bg4);box-shadow:var(--glow)}
.scroll-bottom-btn .badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:var(--white);font-size:10px;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center;font-weight:bold}

/* ========== EMOJI PICKER ========== */
.emoji-picker{position:absolute;bottom:60px;right:16px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:320px;max-height:400px;display:flex;flex-direction:column;z-index:50;animation:fadeInUp .2s ease}
.emoji-picker-header{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;padding:4px}
.emoji-cat-btn{flex:0 0 auto;padding:6px 10px;font-size:16px;color:var(--text-dim);border-radius:var(--radius-sm);transition:background .15s}
.emoji-cat-btn.active{background:var(--bg4);color:var(--accent)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;overflow-y:auto;flex:1}
.emoji-item{font-size:22px;padding:4px;text-align:center;cursor:pointer;border-radius:var(--radius-sm);transition:background .1s ease}
.emoji-item:hover{background:var(--bg4)}

/* ========== ADMIN PANEL ========== */
.admin-panel{background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;min-width:0;overflow:hidden;animation:slideInRight .2s ease}
@keyframes slideInRight{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.admin-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:bold;color:var(--accent);letter-spacing:1px;font-size:12px;flex-shrink:0}
.admin-tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.admin-tabs::-webkit-scrollbar{display:none}
.admin-tab{flex:1;padding:10px 6px;font-size:11px;color:var(--text-dim);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;background:none;min-width:70px}
.admin-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.admin-tab:hover:not(.active){color:var(--text)}
.admin-content{flex:1;overflow-y:auto;padding:12px;min-height:0}
.admin-section{margin-bottom:18px}
.admin-section h3{font-size:12px;color:var(--accent);margin-bottom:10px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:4px}
.admin-row{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:6px;font-size:12px;transition:border-color .15s ease}
.admin-row:hover{border-color:var(--border2)}
.admin-row-title{color:var(--text-hi);font-weight:bold;font-size:12px}
.admin-row-sub{color:var(--text-dim);font-size:11px;margin-top:3px;line-height:1.4}
.admin-row-actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;align-items:center}
.admin-btn{font-size:10px;padding:4px 8px;border-radius:var(--radius-sm);background:var(--bg4);border:1px solid var(--border2);color:var(--text);transition:all .15s ease;white-space:nowrap}
.admin-btn:hover{border-color:var(--accent);color:var(--accent)}
.admin-btn.danger{border-color:var(--danger);color:var(--danger)}
.admin-btn.danger:hover{background:var(--danger);color:var(--bg)}
.admin-btn.primary{border-color:var(--accent);color:var(--accent)}
.admin-btn.primary:hover{background:var(--accent);color:var(--bg)}
.admin-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.admin-stat{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center}
.admin-stat-value{font-size:24px;color:var(--accent);font-weight:bold;font-variant-numeric:tabular-nums}
.admin-stat-label{font-size:10px;color:var(--text-dim);letter-spacing:1px;margin-top:4px;text-transform:uppercase}
.admin-select{font-size:11px;padding:4px;max-width:120px}
.admin-input{font-size:11px;padding:6px 10px;width:100%;margin-top:4px}

/* ========== MODALS ========== */
.modal-root{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:var(--z-modal);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:20px;animation:fadeIn .15s ease}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:min(540px,100%);max-height:85vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:modalAppear .2s ease}
@keyframes modalAppear{from{transform:scale(.95) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal.wide{width:min(760px,100%)}
.modal.narrow{width:min(400px,100%)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-title{font-size:14px;color:var(--accent);letter-spacing:1px;font-weight:bold;text-transform:uppercase}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1;min-height:0}
.modal-body label{font-size:11px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:4px}
.modal-body input[type=text],.modal-body input[type=password],.modal-body input[type=number],.modal-body select,.modal-body textarea{width:100%}
.modal-body textarea{resize:vertical;min-height:80px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;flex-wrap:wrap}
.modal-user-row{display:flex;align-items:center;gap:10px;padding:8px;background:var(--bg3);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;transition:background .15s ease}
.modal-user-row:hover{background:var(--bg4)}
.modal-checkbox{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--text)}
.modal-checkbox input{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.modal-warn{background:var(--warn-dim);border:1px solid var(--warn);border-radius:var(--radius-sm);padding:10px;font-size:11px;color:var(--warn);line-height:1.4}
.modal-danger{background:var(--danger-dim);border:1px solid var(--danger);border-radius:var(--radius-sm);padding:10px;font-size:11px;color:var(--danger);line-height:1.4}
.modal-info{background:var(--info-dim);border:1px solid var(--info);border-radius:var(--radius-sm);padding:10px;font-size:11px;color:var(--info);line-height:1.4}
.modal-search{width:100%;padding:10px 14px;border-radius:20px;font-size:12px}

/* ========== USER PROFILE MODAL ========== */
.profile-header{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 0;text-align:center}
.profile-avatar{width:96px;height:96px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:bold;color:var(--accent);overflow:hidden;border:2px solid var(--accent-dim)}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:18px;font-weight:bold;color:var(--text-hi)}
.profile-username{font-size:12px;color:var(--text-dim)}
.profile-status{font-size:12px;color:var(--text);font-style:italic;margin-top:4px}
.profile-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.profile-info-row{background:var(--bg3);border-radius:var(--radius-sm);padding:8px 10px;font-size:11px}
.profile-info-label{color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;font-size:9px}
.profile-info-value{color:var(--text);margin-top:2px;font-weight:bold}

/* ========== CHAT INFO PANEL ========== */
.chat-info-panel{position:absolute;right:0;top:0;bottom:0;width:340px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:5;animation:slideInRight .2s ease;box-shadow:-10px 0 30px rgba(0,0,0,.5)}
.chat-info-panel-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.chat-info-panel-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-info-section{padding-bottom:12px;border-bottom:1px solid var(--border)}
.chat-info-section h4{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.chat-info-avatar{width:80px;height:80px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--accent);overflow:hidden;border:2px solid var(--accent-dim);margin:0 auto 12px}
.chat-info-avatar img{width:100%;height:100%;object-fit:cover}
.chat-member{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:12px;cursor:pointer;border-radius:var(--radius-sm)}
.chat-member:hover{background:var(--bg3)}
.chat-member-avatar{width:28px;height:28px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent);overflow:hidden;flex-shrink:0}
.chat-member-avatar img{width:100%;height:100%;object-fit:cover}

/* ========== LIGHTBOX ========== */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;z-index:var(--z-lightbox);padding:20px;animation:fadeIn .2s ease}
.lightbox img{max-width:100%;max-height:90vh;object-fit:contain;user-select:none}
.lightbox-close{position:absolute;top:20px;right:20px;font-size:32px;color:var(--white);background:rgba(0,0,0,.5);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid #ffffff44;transition:all .15s ease}
.lightbox-close:hover{background:rgba(255,255,255,.15)}

/* ========== CONTEXT MENU ========== */
.context-menu{position:fixed;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:4px;z-index:var(--z-context);min-width:180px;animation:fadeInUp .15s ease}
.context-item{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:12px;cursor:pointer;border-radius:var(--radius-sm);color:var(--text)}
.context-item:hover{background:var(--bg4);color:var(--accent)}
.context-item.danger{color:var(--danger)}
.context-item.danger:hover{background:var(--danger-dim)}
.context-item-icon{width:16px;text-align:center;font-size:14px}
.context-divider{height:1px;background:var(--border);margin:4px 0}

/* ========== VOICE OVERLAY ========== */
.voice-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:var(--z-voice);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px;animation:fadeIn .2s ease}
.voice-box{background:var(--bg2);border:2px solid var(--accent);border-radius:var(--radius-xl);padding:30px;text-align:center;min-width:340px;max-width:100%;box-shadow:0 0 80px var(--accent-glow),var(--shadow-lg);animation:voiceAppear .3s ease}
@keyframes voiceAppear{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.voice-title{color:var(--accent);letter-spacing:3px;font-size:12px;margin-bottom:16px;text-transform:uppercase}
.voice-timer{font-size:54px;color:var(--text-hi);font-weight:bold;margin-bottom:24px;font-variant-numeric:tabular-nums;letter-spacing:2px;text-shadow:0 0 20px var(--accent-glow)}
.voice-recording{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--danger);margin-right:10px;animation:recordingPulse 1s infinite}
@keyframes recordingPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
.voice-waveform{display:flex;align-items:center;justify-content:center;gap:3px;height:60px;margin-bottom:20px;padding:0 20px}
.voice-waveform-bar{width:3px;background:var(--accent);border-radius:2px;transition:height .05s ease;min-height:4px}
.voice-label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:8px;letter-spacing:1px;text-transform:uppercase}
.voice-box select{width:100%;margin-bottom:20px;padding:10px;font-size:13px}
.voice-actions{display:flex;gap:10px}
.voice-actions button{flex:1}

/* ========== TOASTS ========== */
.toast-root{position:fixed;top:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:var(--z-toast);pointer-events:none;max-width:360px}
.toast{background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--accent);padding:12px 16px;border-radius:var(--radius-sm);font-size:12px;box-shadow:var(--shadow);animation:toastSlideIn .3s ease;pointer-events:auto;color:var(--text);line-height:1.4;word-break:break-word}
.toast.error{border-left-color:var(--danger);background:var(--danger-dim);color:var(--text-hi)}
.toast.warn{border-left-color:var(--warn);background:var(--warn-dim);color:var(--text-hi)}
.toast.success{border-left-color:var(--accent);background:var(--accent-dim);color:var(--text-hi)}
.toast.info{border-left-color:var(--info);background:var(--info-dim);color:var(--text-hi)}
@keyframes toastSlideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ========== URGENT ALERT ========== */
.urgent-alert{position:fixed;top:0;left:0;right:0;background:var(--danger);color:var(--white);padding:14px 20px;text-align:center;font-size:13px;font-weight:bold;z-index:var(--z-alert);letter-spacing:1px;animation:toastSlideIn .3s ease;box-shadow:0 2px 20px rgba(0,0,0,.8);cursor:pointer}
.urgent-alert::before{content:'⚠ ';margin-right:8px}

/* ========== UTILITIES ========== */
[hidden]{display:none !important}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center-text{text-align:center}
.dim-text{color:var(--text-dim)}
.warn-text{color:var(--warn)}
.danger-text{color:var(--danger)}
.accent-text{color:var(--accent)}
.bold-text{font-weight:bold}
.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.mb-4{margin-bottom:4px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-4{gap:4px}.gap-8{gap:8px}.gap-12{gap:12px}
.flex-1{flex:1}.min-w-0{min-width:0}
.no-scrollbar{scrollbar-width:none;-ms-overflow-style:none}
.no-scrollbar::-webkit-scrollbar{display:none}
.divider{height:1px;background:var(--border);margin:8px 0}
.pill{display:inline-block;background:var(--bg4);padding:2px 8px;border-radius:10px;font-size:10px;color:var(--text-dim)}
.pill.accent{background:var(--accent-dim);color:var(--text-hi)}
.pill.warn{background:var(--warn-dim);color:var(--warn)}
.pill.danger{background:var(--danger-dim);color:var(--danger)}

/* ========== RESPONSIVE ========== */
@media(max-width:900px){
.app{grid-template-columns:1fr}
.app.admin-open{grid-template-columns:1fr}
.sidebar{position:absolute;inset:0;z-index:var(--z-sidebar);transition:transform .25s ease;max-width:100%}
.sidebar.hidden{transform:translateX(-100%)}
.msg{max-width:88%}
.admin-panel{position:absolute;inset:0;z-index:var(--z-admin);max-width:100%}
.modal{max-height:92vh}
.login-box{padding:30px 24px}
.login-logo{font-size:56px}
.voice-timer{font-size:42px}
.voice-box{padding:24px;min-width:0}
.chat-info-panel{width:100%}
}
@media(max-width:480px){
.chat-header{padding:10px 12px}
.messages{padding:12px}
.composer{padding:10px 12px}
.msg{max-width:92%}
.toast-root{left:20px;right:20px;max-width:none}
}

/* ========== PRINT ========== */
@media print{
body{background:white;color:black}
.sidebar,.admin-panel,.composer,.chat-header,.msg-actions,.toast-root,.modal-root,.voice-overlay,.scroll-bottom-btn{display:none !important}
.chat-area{width:100%}
.msg-bubble{background:white;border:1px solid black;color:black}
}
</style>

<body>

<!-- ==========================================================================
     LOGIN SCREEN
     ========================================================================== -->
<div id="login-screen" class="login-screen">
    <div class="login-box">
        <div class="login-logo">SCP</div>
        <div class="login-sub">Foundation Secure Terminal</div>
        <div class="login-tabs">
            <button type="button" class="login-tab active" data-tab="login">ВХОД</button>
            <button type="button" class="login-tab" data-tab="register">РЕГИСТРАЦИЯ</button>
        </div>
        <form id="login-form" class="login-form" autocomplete="on">
            <input type="text" id="login-username" placeholder="Логин" autocomplete="username" required autofocus maxlength="64">
            <input type="password" id="login-password" placeholder="Пароль" autocomplete="current-password" required maxlength="256">
            <button type="submit" class="btn-primary">ВОЙТИ В СИСТЕМУ</button>
            <div class="login-error" id="login-error"></div>
        </form>
        <form id="register-form" class="login-form" autocomplete="on" hidden>
            <input type="text" id="reg-username" placeholder="Логин (3-24, a-z0-9_)" autocomplete="username" required pattern="[a-zA-Z0-9_]{3,24}" maxlength="24">
            <input type="password" id="reg-password" placeholder="Пароль (мин. 6)" autocomplete="new-password" required minlength="6" maxlength="256">
            <div class="pwd-strength"><div class="pwd-strength-bar" id="pwd-strength-bar"></div></div>
            <input type="text" id="reg-invite" placeholder="Инвайт-код (INV-XXXXXX-ROLE)" required maxlength="64">
            <button type="submit" class="btn-primary">ЗАРЕГИСТРИРОВАТЬСЯ</button>
            <div class="login-error" id="register-error"></div>
        </form>
    </div>
</div>

<!-- ==========================================================================
     MAIN APP
     ========================================================================== -->
<div id="app" class="app" hidden>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <header class="sidebar-header">
            <div class="brand">SCP<span class="brand-dot">●</span></div>
            <div class="sidebar-actions">
                <button id="btn-new-chat" class="icon-btn" title="Новый чат (Ctrl+N)">➕</button>
                <button id="btn-admin" class="icon-btn" title="Админ-панель (Ctrl+Shift+A)" hidden>🛡</button>
                <button id="btn-settings" class="icon-btn" title="Настройки (Ctrl+,)">⚙</button>
            </div>
        </header>
        <div class="sidebar-search">
            <input type="search" id="search-input" placeholder="Поиск (Ctrl+K)..." autocomplete="off" maxlength="64">
        </div>
        <nav class="sidebar-tabs">
            <button type="button" class="tab-btn active" data-tab="chats">Чаты</button>
            <button type="button" class="tab-btn" data-tab="contacts">Контакты</button>
        </nav>
        <div id="chat-list" class="chat-list"></div>
        <div id="contact-list" class="chat-list" hidden></div>
        <footer class="sidebar-footer" id="me-footer">
            <div id="me-info" class="me-info"></div>
        </footer>
    </aside>

    <!-- ===== CHAT AREA ===== -->
    <main class="chat-area" id="chat-area">
        <div class="chat-empty" id="chat-empty">
            <div class="chat-empty-logo">SCP</div>
            <div class="chat-empty-sub">[ SECURE CHANNEL STANDBY ]</div>
            <div class="chat-empty-hint">Выберите канал связи</div>
        </div>

        <div id="chat-view" class="chat-view" hidden>
            <header class="chat-header">
                <div class="chat-avatar" id="chat-avatar"></div>
                <div class="chat-info" id="chat-info">
                    <div class="chat-name" id="chat-name">—</div>
                    <div class="chat-sub" id="chat-sub">—</div>
                </div>
                <div class="chat-actions">
                    <button id="btn-chat-search" class="icon-btn" title="Поиск в чате (Ctrl+F)">🔍</button>
                    <button id="btn-chat-info" class="icon-btn" title="Информация">ℹ</button>
                </div>
            </header>

            <div class="messages" id="messages"></div>

            <div class="typing-indicator" id="typing-indicator" hidden>
                <div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>
                <span id="typing-text">Агент печатает...</span>
            </div>

            <div class="scroll-bottom-btn" id="scroll-bottom-btn" title="Вниз">
                ⬇
                <span class="badge" id="scroll-bottom-badge" hidden>0</span>
            </div>

            <footer class="composer" id="composer">
                <div class="composer-reply-bar" id="composer-reply-bar" hidden>
                    <div class="composer-reply-bar-content">
                        <div class="composer-reply-bar-author" id="reply-author"></div>
                        <div class="composer-reply-bar-text" id="reply-text"></div>
                    </div>
                    <button class="icon-btn sm" id="btn-cancel-reply">✕</button>
                </div>
                <button id="btn-attach" class="icon-btn" title="Вложение">📎</button>
                <button id="btn-emoji" class="icon-btn" title="Эмодзи">😊</button>
                <input type="text" id="msg-input" placeholder="Введите сообщение..." autocomplete="off" maxlength="4000">
                <button id="btn-mic" class="icon-btn" title="Голосовое">🎤</button>
                <button id="btn-send" class="icon-btn primary" title="Отправить (Enter)">➤</button>
            </footer>
        </div>

        <!-- CHAT INFO PANEL (скрытая по умолчанию) -->
        <div class="chat-info-panel" id="chat-info-panel" hidden>
            <header class="chat-info-panel-header">
                <span class="modal-title">Информация</span>
                <button class="icon-btn sm" id="btn-close-chat-info">✕</button>
            </header>
            <div class="chat-info-panel-body" id="chat-info-panel-body"></div>
        </div>
    </main>

    <!-- ===== ADMIN PANEL ===== -->
    <aside class="admin-panel" id="admin-panel" hidden>
        <header class="admin-header">
            <span>⚙ ADMIN PANEL</span>
            <button id="btn-admin-close" class="icon-btn">✕</button>
        </header>
        <nav class="admin-tabs">
            <button type="button" class="admin-tab active" data-atab="stats">Стат.</button>
            <button type="button" class="admin-tab" data-atab="users">Агенты</button>
            <button type="button" class="admin-tab" data-atab="reports">Жалобы</button>
            <button type="button" class="admin-tab" data-atab="o5">О5</button>
            <button type="button" class="admin-tab" data-atab="chats">Чаты</button>
            <button type="button" class="admin-tab" data-atab="audit">Лог</button>
            <button type="button" class="admin-tab" data-atab="tools">Тулзы</button>
        </nav>
        <div class="admin-content" id="admin-content"></div>
    </aside>
</div>

<!-- ==========================================================================
     MODALS / OVERLAYS
     ========================================================================== -->
<div id="modal-root" class="modal-root" hidden></div>
<div id="context-menu-root"></div>
<div id="lightbox-root"></div>

<!-- VOICE OVERLAY -->
<div id="voice-overlay" class="voice-overlay" hidden>
    <div class="voice-box">
        <div class="voice-title"><span class="voice-recording"></span>ЗАПИСЬ ГОЛОСА</div>
        <div class="voice-timer" id="voice-timer">00:00</div>
        <div class="voice-waveform" id="voice-waveform"></div>
        <label class="voice-label">Эффект:</label>
        <select id="voice-effect">
            <option value="none">Без эффекта (оригинал)</option>
            <option value="radio">📻 Радиопомехи</option>
            <option value="scp049">☠ SCP-049 (глубокий бас)</option>
            <option value="noise">📡 Шум / помехи</option>
            <option value="chipmunk">🐿 Ускорение (высокий голос)</option>
            <option value="slowmo">🐢 Замедление (низкий)</option>
            <option value="robot">🤖 Робот</option>
            <option value="echo">🔊 Эхо</option>
        </select>
        <div class="voice-actions">
            <button type="button" id="btn-voice-cancel" class="btn-secondary">Отмена</button>
            <button type="button" id="btn-voice-stop" class="btn-primary">Стоп и отправить</button>
        </div>
    </div>
</div>

<!-- TOASTS -->
<div id="toast-root" class="toast-root"></div>

<!-- HIDDEN FILE INPUTS -->
<input type="file" id="file-input" style="display:none" multiple>
<input type="file" id="avatar-input" style="display:none" accept="image/png,image/jpeg,image/gif,image/webp">

<!-- SOCKET.IO -->
<script src="/socket.io/socket.io.js"></script>

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function el(tag, attrs, ...children) {
    const e = document.createElement(tag);
    if (attrs) {
        for (const [k, v] of Object.entries(attrs)) {
            if (v == null || v === false) continue;
            if (k === 'class') e.className = v;
            else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
            else if (k === 'dataset') Object.assign(e.dataset, v);
            else if (k.startsWith('on') && typeof v === 'function') {
                e.addEventListener(k.slice(2).toLowerCase(), v);
            } else if (k === 'html') {
                e.innerHTML = v;
            } else if (k === 'text') {
                e.textContent = v;
            } else {
                e.setAttribute(k, v);
            }
        }
    }
    children.flat(Infinity).forEach(c => {
        if (c == null || c === false) return;
        e.appendChild(typeof c === 'string' || typeof c === 'number'
            ? document.createTextNode(String(c))
            : c);
    });
    return e;
}

function toast(text, type = 'info', ms = 3500) {
    const root = $('#toast-root');
    if (!root) return;
    const t = el('div', { class: 'toast ' + type, text });
    root.appendChild(t);
    const remove = () => {
        t.style.opacity = '0';
        t.style.transition = 'opacity 0.3s ease';
        setTimeout(() => t.remove(), 300);
    };
    const timeout = setTimeout(remove, ms);
    t.onclick = () => { clearTimeout(timeout); remove(); };
    return t;
}

async function api(url, opts = {}) {
    const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
    const resp = await fetch(url, { credentials: 'include', ...opts, headers });
    let data = null;
    const ct = resp.headers.get('content-type') || '';
    if (ct.includes('application/json')) {
        try { data = await resp.json(); } catch (e) { data = null; }
    } else {
        try { data = await resp.text(); } catch (e) { data = null; }
    }
    if (!resp.ok) {
        const err = new Error((data && data.error) || `HTTP ${resp.status}`);
        err.status = resp.status;
        err.data = data;
        throw err;
    }
    return data;
}

function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function fmtDate(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit' });
}

function fmtDateFull(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' });
}

function fmtRelative(ts) {
    if (!ts) return '';
    const diff = Math.floor(Date.now() / 1000) - ts;
    if (diff < 60) return 'только что';
    if (diff < 3600) return Math.floor(diff / 60) + ' мин назад';
    if (diff < 86400) return Math.floor(diff / 3600) + ' ч назад';
    if (diff < 604800) return Math.floor(diff / 86400) + ' дн назад';
    return fmtDate(ts);
}

function fmtBytes(n) {
    if (!n) return '0 B';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
    return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

function b64(arr) {
    let s = '';
    for (let i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
    return btoa(s);
}

function debounce(fn, ms = 300) {
    let t = null;
    return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(null, args), ms);
    };
}

function throttle(fn, ms = 100) {
    let last = 0;
    let t = null;
    return (...args) => {
        const now = Date.now();
        if (now - last >= ms) {
            last = now;
            fn.apply(null, args);
        } else {
            clearTimeout(t);
            t = setTimeout(() => {
                last = Date.now();
                fn.apply(null, args);
            }, ms - (now - last));
        }
    };
}

function log(...args) {
    console.log('%c[SCP]', 'color:#44cc44;font-weight:bold', ...args);
}

function logErr(...args) {

function copyToClipboard(text) {
    try {
        navigator.clipboard.writeText(text).then(() => toast('Скопировано', 'success', 1500));
    } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        toast('Скопировано', 'success', 1500);
    }
}

function formatFileSizeError(limit) {

    return mb >= 1024 ? (mb / 1024).toFixed(1) + ' ГБ' : mb + ' МБ';
}

// ==========================================================================
// E2EE (End-to-End Encryption)
// ==========================================================================
async function getDMKey(chat) {
    if (!chat || chat.isGroup || chat.isHelper) return null;
    const otherId = chat.otherUserId;
    if (!otherId) return null;
    if (state.dmKeys.has(chat.id)) return state.dmKeys.get(chat.id);

    const ids = [state.me.id, otherId].sort().join('|');
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
        'raw',
        enc.encode('scp-e2ee-v1:' + ids),
        'PBKDF2',
        false,
        ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
        {
            name: 'PBKDF2',
            salt: enc.encode('scp-foundation-e2ee'),
            iterations: 100000,
            hash: 'SHA-256'
        },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
    );
    state.dmKeys.set(chat.id, key);
    return key;
}

async function encryptText(key, text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        key,
        new TextEncoder().encode(text)
    );
    const combined = new Uint8Array(iv.length + ct.byteLength);
    combined.set(iv, 0);
    combined.set(new Uint8Array(ct), iv.length);
    return b64(combined);
}

async function decryptText(key, b64str) {
    try {
        const data = Uint8Array.from(atob(b64str), c => c.charCodeAt(0));
        const iv = data.slice(0, 12);
        const ct = data.slice(12);
        const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
        return new TextDecoder().decode(pt);
    } catch (e) {
        logErr('decryptText failed', e);
        return null;
    }
}

async function encryptFile(file) {
    const key = crypto.getRandomValues(new Uint8Array(32));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const keyObj = await crypto.subtle.importKey('raw', key, { name: 'AES-GCM' }, false, ['encrypt']);
    const encrypted = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        keyObj,
        await file.arrayBuffer()
    );
    return {
        blob: new Blob([encrypted], { type: 'application/octet-stream' }),
        meta: {
            key: b64(key),
            iv: b64(iv),
            originalName: file.name,
            originalType: file.type || 'application/octet-stream',
            originalSize: file.size
        }
    };
}

async function decryptFile(att) {
    const resp = await fetch(att.url, { credentials: 'include' });
    if (!resp.ok) throw new Error('Download failed');
    const buf = await resp.arrayBuffer();
    const keyBytes = Uint8Array.from(atob(att.enc_meta.key), c => c.charCodeAt(0));
    const ivBytes = Uint8Array.from(atob(att.enc_meta.iv), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['decrypt']);
    const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ivBytes }, key, buf);
    return new Blob([dec], { type: att.enc_meta.originalType || 'application/octet-stream' });
}

async function decryptIncoming(chat, msg) {
    if (!msg || !msg.is_encrypted) return msg;
    if (!msg.text || msg.text.length < 20) return msg;
    const key = await getDMKey(chat);
    if (!key) return { ...msg, text: '[🔒 Нет ключа]', _undecryptable: true };
    const plain = await decryptText(key, msg.text);
    if (plain === null) {
        return { ...msg, text: '[🔒 Не удалось расшифровать]', _undecryptable: true };
    }
    try {
        const parsed = JSON.parse(plain);
        return { ...msg, text: parsed.text || '', _meta: parsed, _decrypted: true };
    } catch (e) {
        return { ...msg, text: plain, _decrypted: true };
    }
}

async function init() {
    log('Initializing SCP Terminal v3.1...');
    applyTheme(state.theme);
    bindEvents();
    setupServiceWorker();

    try {
        state.me = await api('/api/me');
    } catch (e) {
        if (e.status === 403 && e.data && e.data.error === 'BANNED') {
            const errEl = $('#login-error');
            if (errEl) {
                errEl.textContent = `🚫 Вы забанены: ${e.data.ban_reason || 'нарушение правил'}`;
            }
        }
        showLogin();
        return;
    }

    hideLogin();
    await Promise.all([loadChats(), loadContacts()]);
    renderMe();
    connectSocket();
    setupBroadcastChannel();
    updateNotificationBadge();
    log('Init complete for @' + (state.me.username || '?'));
}

function showLogin() {
    const ls = $('#login-screen');
    const app = $('#app');
    if (ls) ls.style.display = 'flex';
    if (app) app.hidden = true;
}

function hideLogin() {
    const ls = $('#login-screen');
    const app = $('#app');
    if (ls) ls.style.display = 'none';
    if (app) app.hidden = false;
}

function renderMe() {
    const me = state.me;
    if (!me) return;
    const clearName = CLEARANCE_NAMES[me.clearance_level] || 'Класс-D';
    const info = $('#me-info');
    if (!info) return;
    const initials = (me.displayName || me.username || '?')[0].toUpperCase();
    info.innerHTML = `
        <div class="me-avatar">
            ${me.avatarUrl ? `<img src="${escapeHtml(me.avatarUrl)}" alt="">` : escapeHtml(initials)}
            <span class="online-dot"></span>
        </div>
        <div class="me-body">
            <div class="me-name">${escapeHtml(me.displayName || me.username)}</div>
            <div class="me-sub">L${me.clearance_level} · ${escapeHtml(clearName)} · ${me.xp || 0} XP</div>
        </div>
    `;
    const adminBtn = $('#btn-admin');
    if (adminBtn && ['helper', 'moderator', 'admin', 'sysadmin'].includes(me.role)) {
        adminBtn.hidden = false;
    }
}

// ==========================================================================
function connectSocket() {
    if (typeof io === 'undefined') {
        logErr('Socket.IO not loaded');
        return;
    }
    state.socket = io({ withCredentials: true });

    state.socket.on('connect', () => log('socket connected'));
    state.socket.on('disconnect', () => log('socket disconnected'));
    state.socket.on('connect_error', e => logErr('socket error', e.message));

    state.socket.on('newMessage', async payload => {
        try {
            const chat = state.chats.find(c => c.id === payload.chatId);
            if (!chat) { await loadChats(); return; }
            const msg = await decryptIncoming(chat, payload);
            chat.lastMessage = msg;

            if (chat.id === state.activeChatId) {
                if (!state.messages.find(m => m.id === msg.id)) {
                    state.messages.push(msg);
                }
                renderMessages();
                if (!document.hidden) markRead(chat.id);
            } else {
                chat.unreadCount = (chat.unreadCount || 0) + 1;
            }
            renderChatList();
            updateNotificationBadge();
            maybeNotify(chat, msg);
            if (state.bc) {
                state.bc.postMessage({
                    type: 'newMessage',
                    chatId: chat.id,
                    msgId: msg.id
                });
            }
        } catch (e) { logErr('newMessage handler', e); }
    });

    state.socket.on('messageDeleted', ({ messageId, type }) => {
        if (type === 'all') {
            state.messages = state.messages.filter(m => m.id !== messageId);
        } else {
            const m = state.messages.find(x => x.id === messageId);
            if (m) m._deletedForMe = true;
        }
        renderMessages();
    });

    state.socket.on('messageEdited', ({ messageId, text }) => {
        const m = state.messages.find(x => x.id === messageId);
        if (m) {
            m.text = text;
            m.edited = true;
            renderMessages();
        }
    });

    state.socket.on('messageReaction', ({ messageId, reactions }) => {
        const m = state.messages.find(x => x.id === messageId);
        if (m) {
            m.reactions = reactions;
            renderMessages();
        }
    });

    state.socket.on('pollUpdated', ({ messageId, poll }) => {
        const m = state.messages.find(x => x.id === messageId);
        if (m) { m.poll = poll; renderMessages(); }
    });

    state.socket.on('chatCleared', ({ chatId, scope }) => {
        if (chatId === state.activeChatId) {
            state.messages = scope === 'me'
                ? state.messages.filter(m => m._deletedForMe)
                : [];
            renderMessages();
        }
    });

    state.socket.on('chatPinned', ({ chatId, pinned_messages }) => {
        const c = state.chats.find(x => x.id === chatId);
        if (c) c.pinned_messages = pinned_messages;
    });

    state.socket.on('refreshData', async () => {
        await loadChats();
        await loadContacts();
    });

    state.socket.on('roleChanged', async () => {
        try {
            state.me = await api('/api/me');
            renderMe();
            toast('Ваша роль обновлена', 'info');
        } catch (e) {}
    });

    state.socket.on('forceLogout', data => {
        if (data && data.deleted) toast('Аккаунт удалён', 'error', 5000);
        else if (data && data.ban_expires) toast(`Вы забанены: ${data.ban_reason || ''}`, 'error', 5000);
        else toast('Сессия завершена', 'warn');
        setTimeout(() => location.reload(), 2500);
    });

    state.socket.on('urgentAlert', ({ text, sender }) => {
        const alert = el('div', { class: 'urgent-alert' }, `${sender}: ${text}`);
        document.body.appendChild(alert);
        setTimeout(() => alert.remove(), 10000);
        alert.onclick = () => alert.remove();
    });

    state.socket.on('newReport', () => {
        if (state.adminTab === 'reports' && state.adminOpen) loadAdminReports();
        toast('📋 Новая жалоба', 'warn');
    });

    state.socket.on('newO5Request', () => {
        if (state.adminTab === 'o5' && state.adminOpen) loadAdminO5();
    });

    state.socket.on('o5RequestApproved', ({ title }) => {
        toast('🛡 О5-запрос одобрен: ' + title, 'warn', 6000);
    });

    state.socket.on('o5RequestUpdated', () => {
        if (state.adminTab === 'o5' && state.adminOpen) loadAdminO5();
    });

    state.socket.on('allMessagesWiped', () => {
        state.messages = [];
        renderMessages();
        toast('Все сообщения удалены SysAdmin', 'warn', 5000);
    });

    state.socket.on('presenceUpdate', ({ userId, status }) => {
        if (status === 'online') state.onlineUsers.add(userId);
        else state.onlineUsers.delete(userId);
        renderChatList();
    });

    state.socket.on('userTyping', ({ userId, chatId, isTyping }) => {
        if (chatId !== state.activeChatId) return;
        if (isTyping) {
            state.typingUsers.set(userId, Date.now());
        } else {
            state.typingUsers.delete(userId);
        }
        updateTypingIndicator();
    });
}

// ==========================================================================
// УВЕДОМЛЕНИЯ
// ==========================================================================
function setupServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('/sw.js').then(reg => {
        state.swReg = reg;
        log('SW registered');
    }).catch(err => {
        logErr('SW registration failed:', err.message);
        if (err.message && (err.message.includes('404') || err.message.includes('MIME'))) {
            registerSWFromBlob();
        }
    });
    navigator.serviceWorker.addEventListener('message', e => {
        const d = e.data || {};
        if (d.type === 'openChat' && d.url) {
            const m = d.url.match(/chat=([^&]+)/);
            if (m) openChat(m[1]);
        }
    });
}

function registerSWFromBlob() {
    const swCode = [
        "self.addEventListener('install', e => self.skipWaiting());",
        "self.addEventListener('activate', e => e.waitUntil(clients.claim()));",
        "self.addEventListener('push', e => {",
        "  let d = {};",
        "  try { d = e.data.json(); } catch (x) {}",
        "  e.waitUntil(self.registration.showNotification(d.title || 'SCP Foundation', {",
        "    body: d.body || 'Новое сообщение',",
        "    tag: d.tag || 'scp-msg',",
        "    renotify: true,",
        "    data: { chatId: d.chatId, messageId: d.messageId, url: '/?chat=' + (d.chatId || '') }",
        "  }));",
        "});",
        "self.addEventListener('notificationclick', e => {",
        "  e.notification.close();",
        "  const url = (e.notification.data && e.notification.data.url) || '/';",
        "  e.waitUntil((async () => {",
        "    const list = await clients.matchAll({ type: 'window', includeUncontrolled: true });",
        "    for (const c of list) {",
        "      if ('focus' in c) { c.postMessage({ type: 'openChat', url }); return c.focus(); }",
        "    }",
        "    return clients.openWindow(url);",
        "  })());",
        "});"
    ].join('\n');
    try {
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        navigator.serviceWorker.register(url).then(reg => {
            state.swReg = reg;
            log('SW registered from blob');
        }).catch(e => logErr('Blob SW failed:', e.message));
    } catch (e) { logErr('registerSWFromBlob', e); }
}

function urlB64ToU8(base64) {
    const pad = '='.repeat((4 - base64.length % 4) % 4);
    const b = atob((base64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from([...b].map(c => c.charCodeAt(0)));
}

async function subscribePush() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    try {
        const reg = state.swReg || await navigator.serviceWorker.ready;
        const r = await api('/api/push/vapid-key').catch(() => ({ publicKey: null }));
        if (!r || !r.publicKey) return;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
            sub = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlB64ToU8(r.publicKey)
            });
        }
        await api('/api/push/subscribe', { method: 'POST', body: JSON.stringify(sub.toJSON()) }).catch(() => {});
    } catch (e) { logErr('subscribePush', e); }
}

async function requestNotifPermission() {
    if (!('Notification' in window)) {
        toast('Браузер не поддерживает уведомления', 'warn');
        return;
    }
    const p = await Notification.requestPermission();
    if (p === 'granted') {
        state.notificationsEnabled = true;
        await subscribePush();
        toast('Уведомления включены', 'success');
    } else {
        toast('Уведомления запрещены', 'warn');
    }
}

function maybeNotify(chat, msg) {
    if (!document.hidden) return;
    if (!state.me || (msg.sender && msg.sender.id === state.me.id)) return;

            tag: 'chat-' + chat.id,

        });

    } catch (e) {}

function renderChatList() {
    const list = $('#chat-list');
    if (!list) return;
    list.innerHTML = '';
    const pinned = (state.me && state.me.pinned_chats) || [];
    const sorted = [...state.chats].sort((a, b) => {
        const ap = pinned.includes(a.id) ? 1 : 0;
        const bp = pinned.includes(b.id) ? 1 : 0;
        if (ap !== bp) return bp - ap;
        const at = (a.lastMessage && a.lastMessage.createdAt) || a.createdAt || 0;
        const bt = (b.lastMessage && b.lastMessage.createdAt) || b.createdAt || 0;
        return bt - at;
    });
    sorted.forEach(c => {
        const isPinned = pinned.includes(c.id);
        const isOnline = c.otherUserId && state.onlineUsers.has(c.otherUserId);
        const item = el('div', {
            class: 'chat-item' +
                (c.id === state.activeChatId ? ' active' : '') +
                (c.unreadCount ? ' unread' : ''),
            dataset: { id: c.id }
        });
        const av = el('div', { class: 'chat-item-avatar' });
        if (c.avatarUrl) av.innerHTML = `<img src="${escapeHtml(c.avatarUrl)}" alt="">`;
        else av.textContent = (c.name || '?')[0].toUpperCase();
        if (isOnline) av.appendChild(el('span', { class: 'online-dot' }));

        let preview = 'Канал связи';
        if (c.lastMessage) {
            if (c.lastMessage.is_encrypted) preview = '🔒 [зашифровано]';
            else preview = (c.lastMessage.text || '[вложение]').slice(0, 50);
        } else if (c.isChannel) preview = '📢 Канал';
        else if (c.isGroup) preview = '👥 Группа';

        const body = el('div', { class: 'chat-item-body' },
            el('div', { class: 'chat-item-name' },
                (isPinned ? '📌 ' : '') + (c.name || '?'),
                c.is_black_channel ? el('span', { class: 'chat-item-icon' }, ' 🕵') : null,
                c.isChannel ? el('span', { class: 'chat-item-icon' }, ' 📢') : null
            ),
            el('div', { class: 'chat-item-preview' }, preview)
        );
        const meta = el('div', { class: 'chat-item-meta' });
        if (c.unreadCount) meta.appendChild(el('div', { class: 'chat-item-badge' }, String(c.unreadCount)));
        item.append(av, body, meta);
        item.onclick = () => openChat(c.id);
        list.appendChild(item);
    });
}

function renderContactList() {
    const list = $('#contact-list');
    if (!list) return;
    list.innerHTML = '';
    state.contacts.forEach(u => {
        const item = el('div', { class: 'chat-item' });
        const av = el('div', { class: 'chat-item-avatar' });
        if (u.avatarUrl) av.innerHTML = `<img src="${escapeHtml(u.avatarUrl)}" alt="">`;
        else av.textContent = (u.displayName || u.username || '?')[0].toUpperCase();
        if (state.onlineUsers.has(u.id)) av.appendChild(el('span', { class: 'online-dot' }));
        item.append(av, el('div', { class: 'chat-item-body' },

        ));

function openEmojiPicker() {
    if (state.emojiPickerOpen) { closeEmojiPicker(); return; }
    state.emojiPickerOpen = true;
    const composer = $('#composer');
    if (!composer) return;

    const picker = el('div', { class: 'emoji-picker', id: 'emoji-picker' });
    const header = el('div', { class: 'emoji-picker-header' });
    const cats = Object.keys(EMOJI_CATEGORIES);
    const labels = {
        smileys: '😀', gestures: '👋', hearts: '❤️', animals: '🐶',
        food: '🍎', activity: '⚽', travel: '🚗', objects: '💡', symbols: '❤️'
    };

    let currentCat = cats[0];
    const grid = el('div', { class: 'emoji-grid' });

    function renderGrid(cat) {
        grid.innerHTML = '';
        (EMOJI_CATEGORIES[cat] || []).forEach(emoji => {
            const item = el('div', { class: 'emoji-item', text: emoji });
            item.onclick = () => {
                const input = $('#msg-input');
                if (input) {
                    const start = input.selectionStart || input.value.length;
                    input.value = input.value.slice(0, start) + emoji + input.value.slice(input.selectionEnd || input.value.length);
                    input.focus();
                    input.setSelectionRange(start + emoji.length, start + emoji.length);
                }
            };
            grid.appendChild(item);
        });
    }

    cats.forEach(cat => {
        const btn = el('button', {
            type: 'button',
            class: 'emoji-cat-btn' + (cat === currentCat ? ' active' : ''),
            text: labels[cat] || cat[0]
        });
        btn.onclick = () => {
            currentCat = cat;
            header.querySelectorAll('.emoji-cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGrid(cat);
        };
        header.appendChild(btn);
    });

    picker.append(header, grid);
    composer.appendChild(picker);
    renderGrid(currentCat);

    setTimeout(() => {
        document.addEventListener('click', closeEmojiOnOutsideClick);
    }, 0);
}

function closeEmojiPicker() {
    state.emojiPickerOpen = false;
    const p = $('#emoji-picker');
    if (p) p.remove();
    document.removeEventListener('click', closeEmojiOnOutsideClick);
}
