// ==========================================================================
function openContextMenu(x, y, items) {
    closeContextMenu();
    const root = $('#context-menu-root');
    if (!root) return;
    const menu = el('div', { class: 'context-menu' });
    items.forEach(item => {
        if (item.divider) {
            menu.appendChild(el('div', { class: 'context-divider' }));
            return;
        }
        const row = el('div', { class: 'context-item' + (item.danger ? ' danger' : '') },
            el('span', { class: 'context-item-icon', text: item.icon || '' }),
            el('span', { text: item.label })
        );
        row.onclick = () => {
            closeContextMenu();
            try { item.onClick && item.onClick(); } catch (e) { logErr(e); }
        };
        menu.appendChild(row);
    });
    root.appendChild(menu);

    const rect = menu.getBoundingClientRect();
    const maxX = window.innerWidth - rect.width - 8;
    const maxY = window.innerHeight - rect.height - 8;
    menu.style.left = Math.min(x, maxX) + 'px';
    menu.style.top = Math.min(y, maxY) + 'px';

    setTimeout(() => document.addEventListener('click', closeContextMenu), 0);
    setTimeout(() => document.addEventListener('contextmenu', closeContextMenu), 0);
}

function closeContextMenu() {
    const root = $('#context-menu-root');
    if (root) root.innerHTML = '';
    document.removeEventListener('click', closeContextMenu);
    document.removeEventListener('contextmenu', closeContextMenu);
}

// ==========================================================================
// OPEN CHAT
// ==========================================================================
async function openChat(chatId) {
    if (state.activeChatId === chatId && state.messages.length > 0) return;
    state.activeChatId = chatId;
    state.replyTo = null;
    state.editingMessage = null;
    state.chatSearchQuery = '';
    state.chatSearchMatches = [];
    state.chatSearchIndex = -1;
    state.unreadSeparatorShown = false;
    updateReplyBar();

    const chat = state.chats.find(c => c.id === chatId);
    if (!chat) return;

    const empty = $('#chat-empty');
    const view = $('#chat-view');
    if (empty) empty.hidden = true;
    if (view) view.hidden = false;

    const nameEl = $('#chat-name');
    const subEl = $('#chat-sub');
    const avEl = $('#chat-avatar');
    if (nameEl) nameEl.textContent = chat.name || 'Чат';
    if (subEl) {
        if (chat.isGroup) {
            subEl.textContent = (chat.isChannel ? 'Канал' : 'Группа') + (chat.username ? ` · scp.me/${chat.username}` : '');
            subEl.classList.remove('typing');
        } else if (chat.isHelper) {
            subEl.textContent = 'Системный помощник';
        } else if (chat.isSelf) {
            subEl.textContent = 'Избранное';
        } else {
            subEl.textContent = 'Личный канал · E2EE';
        }
    }
    if (avEl) {
        avEl.innerHTML = chat.avatarUrl
            ? `<img src="${escapeHtml(chat.avatarUrl)}" alt="">`
            : (chat.name || '?')[0].toUpperCase();
    }

    if (chat.isGroup && !chat.canAccess) {
        const box = $('#messages');
        if (box) box.innerHTML = `<div class="chat-empty"><div class="chat-empty-sub">⚠ ТРЕБУЕТСЯ ДОПУСК L${chat.required_clearance}</div></div>`;
        if (view) view.hidden = true;
        return;
    }

    const composer = $('#composer');
    if (composer) composer.classList.remove('disabled');

    try {
        const raw = await api(`/api/chats/${chatId}/messages`);
        state.messages = [];
        for (const m of raw) {
            const decrypted = await decryptIncoming(chat, m);
            if (decrypted.sender && decrypted.sender.id) {
                state.users_cache.set(decrypted.sender.id, decrypted.sender);
            }
            state.messages.push(decrypted);
        }
        renderMessages(true);
        markRead(chatId);
        chat.unreadCount = 0;
        renderChatList();
        updateNotificationBadge();
        const input = $('#msg-input');
        if (input) input.focus();
    } catch (e) { toast(e.message, 'error'); }
}

async function markRead(chatId) {
    try {
        await api(`/api/chats/${chatId}/mark-read`, { method: 'POST' });
        if (state.bc) state.bc.postMessage({ type: 'markRead', chatId });
    } catch (e) {}
}

// ==========================================================================
// RENDER MESSAGES
// ==========================================================================
function renderMessages(scrollToBottom) {
    const box = $('#messages');
    if (!box) return;
    const wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 100;
    box.innerHTML = '';

    let lastDate = null;
    let unreadShown = false;

    state.messages.forEach(m => {
        if (m._deletedForMe) return;

        const msgDate = new Date(m.createdAt * 1000).toDateString();
        if (msgDate !== lastDate) {
            const label = formatDateLabel(m.createdAt);
            box.appendChild(el('div', { class: 'date-separator', text: label }));
            lastDate = msgDate;
        }

        if (!unreadShown && state.me && !m.is_self && !m.isHelperBot) {
            const isUnread = (!m.read_by || !m.read_by.includes(state.me.id)) && m.sender && m.sender.id !== state.me.id;
            const isFirstUnread = state.messages.findIndex(x => x.id === m.id) > 0 && isUnread;
            if (isFirstUnread && !state.unreadSeparatorShown) {
                box.appendChild(el('div', { class: 'date-separator', text: '— непрочитанные —' }));
                unreadShown = true;
                state.unreadSeparatorShown = true;
            }
        }

        const msgEl = renderMessageEl(m);
        if (msgEl) box.appendChild(msgEl);
    });

    if (scrollToBottom || wasAtBottom || state.messages.length <= 1) {
        box.scrollTop = box.scrollHeight;
        hideScrollBottom();
    } else {
        updateScrollBottomVisibility();
    }

    if (state.chatSearchQuery && state.chatSearchMatches.length) {
        highlightSearchMatches();
    }
}

function formatDateLabel(ts) {
    const d = new Date(ts * 1000);
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const yesterday = new Date(today.getTime() - 86400000);
    const msgDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());

    if (msgDay.getTime() === today.getTime()) return 'Сегодня';
    if (msgDay.getTime() === yesterday.getTime()) return 'Вчера';

    const diffDays = Math.floor((today - msgDay) / 86400000);
    if (diffDays < 7) return d.toLocaleDateString('ru-RU', { weekday: 'long' });
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' });
}

function renderMessageEl(m) {
    const me = state.me;
    const isSelf = m.sender && m.sender.id === me.id;
    const isAnon = m.is_anonymous || (m.sender && m.sender.is_anonymous);
    const cls = 'msg' +
        (isSelf ? ' self' : '') +
        (isAnon ? ' anon' : '') +
        (m.is_deleted ? ' deleted' : '');

    const wrap = el('div', { class: cls, dataset: { id: m.id } });

    // Avatar
    const av = el('div', { class: 'msg-avatar' });
    if (isAnon) av.textContent = '🕵';
    else if (m.sender && m.sender.avatarUrl) av.innerHTML = `<img src="${escapeHtml(m.sender.avatarUrl)}" alt="">`;
    else av.textContent = ((m.sender && (m.sender.displayName || m.sender.username)) || '?')[0].toUpperCase();
    if (m.sender && m.sender.id) {
        av.onclick = () => openUserProfile(m.sender.id);
    }

    const body = el('div', { class: 'msg-body' });

    // Header (name + time + lock)
    const header = el('div', { class: 'msg-header' });
    const senderName = (m.sender && (m.sender.displayName || m.sender.username)) || 'Неизвестный';
    const senderEl = el('span', { class: 'msg-sender' });
    if (m.sender && m.sender.role && m.sender.role !== 'user') {
        senderEl.appendChild(el('span', { style: 'color:var(--warn)', text: '★ ' }));
    }
    senderEl.appendChild(document.createTextNode(senderName));
    if (m.sender && m.sender.id) senderEl.onclick = () => openUserProfile(m.sender.id);
    header.appendChild(senderEl);
    header.appendChild(el('span', { class: 'msg-time', text: fmtTime(m.createdAt) }));
    if (m.edited) header.appendChild(el('span', { class: 'msg-edited', text: '(изм.)' }));
    if (m.is_encrypted) header.appendChild(el('span', { class: 'msg-lock', text: '🔒' }));
    if (m.expires_at) header.appendChild(el('span', { class: 'msg-lock', text: '⏱' }));

    // Bubble
    const bubble = el('div', { class: 'msg-bubble' });

    // Reply preview
    if (m.reply_to) {
        const replyMsg = state.messages.find(x => x.id === m.reply_to);
        if (replyMsg) {
            const rp = el('div', { class: 'msg-reply-preview' });
            rp.appendChild(el('div', { class: 'msg-reply-author', text: (replyMsg.sender && (replyMsg.sender.displayName || replyMsg.sender.username)) || '?' }));
            rp.appendChild(el('div', { class: 'msg-reply-text', text: (replyMsg.text || '[вложение]').slice(0, 100) }));
            rp.onclick = () => scrollToMessage(m.reply_to);
            bubble.appendChild(rp);
        }
    }

    // Text
    if (m.is_deleted) {
        bubble.appendChild(el('em', { text: '[сообщение удалено]' }));
    } else {
        const contentWrap = el('div');
        contentWrap.innerHTML = renderMessageText(m.text, me.clearance_level || 1);
        bubble.appendChild(contentWrap);
    }

    // Attachments
    if (m.attachments && m.attachments.length) {
        const atts = el('div', { class: 'msg-attachments' });
        m.attachments.forEach(a => atts.appendChild(renderAttachmentEl(a, m)));
        bubble.appendChild(atts);
    }

    // Poll
    if (m.poll) {
        bubble.appendChild(renderPollEl(m, m.poll));
    }

    body.append(header, bubble);

    // Reactions
    if (m.reactions && m.reactions.length) {
        const reactionsBox = el('div', { class: 'msg-reactions' });
        m.reactions.forEach(r => {
            const isMine = r.users && r.users.includes(me.id);
            const chip = el('div', { class: 'msg-reaction' + (isMine ? ' mine' : '') },
                el('span', { text: r.emoji }),
                el('span', { class: 'msg-reaction-count', text: String(r.users ? r.users.length : 0) })
            );
            chip.onclick = () => toggleReaction(m, r.emoji);
            chip.title = (r.users || []).map(uid => {
                const u = state.users_cache.get(uid);
                return u ? (u.displayName || u.username) : uid.slice(0, 6);
            }).join(', ');
            reactionsBox.appendChild(chip);
        });
        body.appendChild(reactionsBox);
    }

    // Actions
    const acts = el('div', { class: 'msg-actions' });
    const reactBtn = el('button', { class: 'msg-action', type: 'button', title: 'Реакция' }, '😊');
    reactBtn.onclick = e => { e.stopPropagation(); showReactionPicker(reactBtn, m); };
    acts.appendChild(reactBtn);

    if (!m.is_deleted) {
        const replyBtn = el('button', { class: 'msg-action', type: 'button', title: 'Ответить' }, '↩');
        replyBtn.onclick = () => setReplyTo(m);
        acts.appendChild(replyBtn);

        const fwdBtn = el('button', { class: 'msg-action', type: 'button', title: 'Форвард' }, '↪');
        fwdBtn.onclick = () => openForwardModal(m);
        acts.appendChild(fwdBtn);

        if (isSelf) {
            const editBtn = el('button', { class: 'msg-action', type: 'button', title: 'Редактировать' }, '✎');
            editBtn.onclick = () => startEditMessage(m);
            acts.appendChild(editBtn);
        }

        if (isSelf || ['admin', 'sysadmin', 'moderator'].includes(me.role)) {
            const del = el('button', { class: 'msg-action', type: 'button', title: 'Удалить' }, '🗑');
            del.onclick = () => {
                if (confirm('Удалить сообщение для всех?')) deleteMessage(m, 'all');
            };
            acts.appendChild(del);
        }

        const pin = el('button', { class: 'msg-action', type: 'button', title: 'Закрепить' }, '📌');
        pin.onclick = async () => {
            try {
                await api(`/api/chats/${state.activeChatId}/pin`, {
                    method: 'POST',
                    body: JSON.stringify({ messageId: m.id, forAll: false })
                });
                toast('Закреплено', 'success');
            } catch (e) { toast(e.message, 'error'); }
        };
        acts.appendChild(pin);
    }

    const hideBtn = el('button', { class: 'msg-action', type: 'button', title: 'Скрыть у себя' }, '🚫');
    hideBtn.onclick = () => deleteMessage(m, 'me');
    acts.appendChild(hideBtn);

    body.appendChild(acts);

    // Status
    if (isSelf) {
        let status = '·';
        if (m.read) status = '✓✓';
        else if (m.delivered) status = '✓';
        const statusEl = el('div', { class: 'msg-status' + (m.read ? ' read' : ''), text: status });
        body.appendChild(statusEl);
    }

    // Right click
    wrap.oncontextmenu = e => {
        e.preventDefault();
        const items = [];
        if (!m.is_deleted) {
            items.push({ icon: '↩', label: 'Ответить', onClick: () => setReplyTo(m) });
            items.push({ icon: '↪', label: 'Переслать', onClick: () => openForwardModal(m) });
            items.push({ icon: '😊', label: 'Реакция', onClick: () => showReactionPicker(wrap, m) });
            if (isSelf) items.push({ icon: '✎', label: 'Редактировать', onClick: () => startEditMessage(m) });
            items.push({ divider: true });
            items.push({ icon: '📋', label: 'Копировать текст', onClick: () => copyToClipboard(m.text || '') });
            items.push({ icon: '🔗', label: 'Ссылка на сообщение', onClick: () => copyToClipboard(location.origin + '/?chat=' + m.chatId + '&msg=' + m.id) });
            items.push({ divider: true });
        }
        if (isSelf || ['admin', 'sysadmin', 'moderator'].includes(me.role)) {
            items.push({ icon: '🗑', label: 'Удалить', danger: true, onClick: () => { if (confirm('Удалить для всех?')) deleteMessage(m, 'all'); } });
        }
        items.push({ icon: '🚫', label: 'Скрыть у себя', onClick: () => deleteMessage(m, 'me') });
        openContextMenu(e.clientX, e.clientY, items);
    };

    wrap.append(av, body);
    return wrap;
}

function renderMessageText(text, clearance) {
    let html = escapeHtml(text || '');
    html = html.replace(/```([\s\S]+?)```/g, '<pre><code>$1</code></pre>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/__(.+?)__/g, '<u>$1</u>');
    html = html.replace(/~~(.+?)~~/g, '<s>$1</s>');
    html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
    html = html.replace(/@([a-zA-Z0-9_]{3,24})/g, '<span class="mention">@$1</span>');
    if (clearance < 3) {
        html = html.replace(/\|\|(.+?)\|\|/g, '<span class="redacted">[ДАННЫЕ УДАЛЕНЫ]</span>');
    } else {
        html = html.replace(/\|\|(.+?)\|\|/g, '<span class="spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>');
    }
    html = html.replace(/\n/g, '<br>');
    return html;
}

function scrollToMessage(msgId) {
    const box = $('#messages');
    if (!box) return;
    const target = box.querySelector(`[data-id="${msgId}"]`);
    if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.style.transition = 'background 0.4s ease';
        const oldBg = target.style.background;
        target.style.background = 'var(--accent-faint)';
        setTimeout(() => { target.style.background = oldBg || ''; }, 800);
    }
}

// ==========================================================================
// ATTACHMENTS
// ==========================================================================
function renderAttachmentEl(a, m) {
    const wrap = el('div', { class: 'msg-attachment' });
    const isImg = (a.mime || '').startsWith('image/') && !a.is_encrypted;
    const isAudio = (a.mime || '').startsWith('audio/') && !a.is_encrypted;
    const isVideo = (a.mime || '').startsWith('video/');

    if (isImg) {
        const img = el('img', { src: a.url, alt: a.name || 'image', loading: 'lazy' });
        img.onclick = e => { e.stopPropagation(); openLightbox(a.url); };
        wrap.appendChild(img);
    } else if (isAudio) {
        if (a.is_voice) {
            wrap.appendChild(el('div', { class: 'msg-attachment-icon', text: '🎙' }));
            const audio = el('audio', { controls: 'controls', src: a.url, style: 'max-width:240px' });
            wrap.appendChild(audio);
        } else {
            wrap.append(
                el('div', { class: 'msg-attachment-icon', text: '🎵' }),
                el('div', { class: 'msg-attachment-info' },
                    el('div', { class: 'msg-attachment-name', text: a.name || 'audio' }),
                    el('audio', { controls: 'controls', src: a.url, style: 'width:100%;margin-top:4px' })
                )
            );
        }
    } else if (isVideo) {
        wrap.appendChild(el('div', { class: 'msg-attachment-icon', text: '🎬' }));
        wrap.append(
            el('div', { class: 'msg-attachment-info' },
                el('div', { class: 'msg-attachment-name', text: a.name || 'video' }),
                el('div', { class: 'msg-attachment-size', text: fmtBytes(a.size || 0) })
            )
        );
    } else {
        wrap.append(
            el('div', { class: 'msg-attachment-icon', text: a.is_encrypted ? '🔐' : '📄' }),
            el('div', { class: 'msg-attachment-info' },
                el('div', { class: 'msg-attachment-name', text: a.name || 'file' }),
                el('div', { class: 'msg-attachment-size' },
                    fmtBytes(a.size || 0),
                    a.is_encrypted ? ' · 🔒' : ''
                )
            )
        );
    }
    wrap.onclick = () => downloadAttachment(a);
    return wrap;
}

async function downloadAttachment(a) {
    try {
        if (a.is_encrypted && a.enc_meta) {
            const blob = await decryptFile(a);
            triggerDownload(blob, a.enc_meta.originalName || a.name || 'file');
        } else {
            const resp = await fetch(a.url, { credentials: 'include' });
            if (!resp.ok) throw new Error('Download failed');
            const blob = await resp.blob();
            triggerDownload(blob, a.name || 'file');
        }
    } catch (e) { toast('Ошибка скачивания: ' + e.message, 'error'); }
}

function triggerDownload(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}

// ==========================================================================
// POLLS
// ==========================================================================
function renderPollEl(m, poll) {
    const wrap = el('div', { class: 'msg-poll' });
    wrap.appendChild(el('div', { class: 'msg-poll-question', text: '📊 ' + (poll.question || 'Опрос') }));
    const total = poll.options.reduce((s, o) => s + o.votes.length, 0);
    const voted = poll.options.some(o => o.votes.includes(state.me.id));
    poll.options.forEach((o, idx) => {
        const pct = total ? Math.round(o.votes.length / total * 100) : 0;
        let cls = 'msg-poll-option';
        if (o.votes.includes(state.me.id)) cls += ' voted';
        if (poll.isQuiz && voted && poll.correctOptionIndex === idx) cls += ' correct';
        if (poll.isQuiz && voted && poll.correctOptionIndex !== idx && o.votes.includes(state.me.id)) cls += ' wrong';
        const btn = el('button', { class: cls, type: 'button' },
            escapeHtml(o.text) + ' ',
            el('span', { class: 'msg-poll-count', text: `${o.votes.length} · ${pct}%` })
        );
        btn.onclick = async () => {
            if (poll.isClosed) return;
            try {
                const r = await api(`/api/messages/${m.id}/vote`, { method: 'POST', body: JSON.stringify({ optionIndex: idx }) });
                m.poll = r.poll;
                renderMessages();
            } catch (e) { toast(e.message, 'error'); }
        };
        wrap.appendChild(btn);
    });
    wrap.appendChild(el('div', { class: 'msg-poll-total', text: 'Всего голосов: ' + total }));
    return wrap;
}

        const resp = await api(`/api/messages/${m.id}/react`, {
            method: 'POST',
            body: JSON.stringify({ emoji })
        });
        m.reactions = resp.reactions || [];
        renderMessages();

        toast('Реакции требуют обновления сервера', 'warn');

// REPLY
// ==========================================================================
function setReplyTo(m) {
    state.replyTo = m;
    updateReplyBar();
    const input = $('#msg-input');
    if (input) input.focus();
}

function clearReply() {
    state.replyTo = null;
    updateReplyBar();
}

function updateReplyBar() {
    const bar = $('#composer-reply-bar');
    const author = $('#reply-author');
    const text = $('#reply-text');
    if (!bar) return;
    if (state.replyTo) {
        bar.hidden = false;
        const m = state.replyTo;
        if (author) author.textContent = (m.sender && (m.sender.displayName || m.sender.username)) || '?';
        if (text) text.textContent = (m.text || '[вложение]').slice(0, 100);
    } else {
        bar.hidden = true;
    }
}

// EDIT MESSAGE
// ==========================================================================
function startEditMessage(m) {
    const input = $('#msg-input');
    if (!input) return;
    state.editingMessage = m;
    input.value = m.text || '';
    input.focus();
    const sendBtn = $('#btn-send');
    if (sendBtn) sendBtn.textContent = '✓';
    input.dataset.mode = 'edit';
    const cancel = el('button', { class: 'btn-ghost', type: 'button', text: 'Отменить' });
    const editBar = el('div', { class: 'composer-reply-bar', id: 'composer-edit-bar' });
    editBar.append(
        el('div', { class: 'composer-reply-bar-content' },
            el('div', { class: 'composer-reply-bar-author', text: '✎ РЕДАКТИРОВАНИЕ' }),
            el('div', { class: 'composer-reply-bar-text', text: (m.text || '').slice(0, 80) })
        ),
        cancel
    );
    cancel.onclick = () => cancelEdit();
    const existingBar = $('#composer-edit-bar');
    if (existingBar) existingBar.remove();
    const composer = $('#composer');
    if (composer) composer.appendChild(editBar);
}

function cancelEdit() {
    state.editingMessage = null;
    const input = $('#msg-input');
    if (input) { input.value = ''; input.dataset.mode = ''; }
    const sendBtn = $('#btn-send');
    if (sendBtn) sendBtn.textContent = '➤';
    const bar = $('#composer-edit-bar');
    if (bar) bar.remove();
}

async function saveEditMessage(text) {
    const m = state.editingMessage;
    if (!m) return;
    try {
        const chat = state.chats.find(c => c.id === m.chatId || c.id === state.activeChatId);
        let payloadText = text;
        if (chat && m.is_encrypted) {
            const key = await getDMKey(chat);
            if (key) payloadText = await encryptText(key, text);
        }
        await api(`/api/messages/${m.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ text: payloadText })
        });
        m.text = text;
        m.edited = true;
        cancelEdit();
        renderMessages();
    } catch (e) {
        toast('Редактирование требует обновления сервера', 'warn');
        cancelEdit();
    }
}

    const body = el('div');
    const search = el('input', { type: 'search', class: 'modal-search', placeholder: 'Поиск чата...' });
    const list = el('div');
    body.append(search, list);

    const allChats = state.chats.filter(c => c.id !== state.activeChatId);

        const q = search.value.toLowerCase();

            else av.textContent = (c.name || '?')[0].toUpperCase();
            row.append(av, el('div', {},
                el('div', { text: c.name }),
                el('div', { style: 'font-size:11px;color:var(--text-dim)', text: (c.isChannel ? 'Канал' : c.isGroup ? 'Группа' : 'Личный') })

async function deleteMessage(m, scope) {
    try {
        await api(`/api/messages/${m.id}`, { method: 'DELETE', body: JSON.stringify({ scope }) });
        if (scope === 'all') state.messages = state.messages.filter(x => x.id !== m.id);
        else m._deletedForMe = true;
        renderMessages();
    } catch (e) { toast(e.message, 'error'); }
}

// ==========================================================================
// SEND MESSAGE
// ==========================================================================
async function sendMessage(text) {
    if (!text || !text.trim()) return;

    if (state.editingMessage) {
        await saveEditMessage(text.trim());
        return;
    }

    const chat = state.chats.find(c => c.id === state.activeChatId);
    if (!chat) return;
    if (Date.now() < state.msgCooldownUntil) {
        toast('Подождите (кулдаун уровня допуска)', 'warn');
        return;
    }
    const trimmed = text.trim();

    let payloadText = trimmed;
    let encrypted = false;
    if (!chat.isGroup && !chat.isHelper) {
        try {
            const key = await getDMKey(chat);
            if (key) {
                payloadText = await encryptText(key, trimmed);
                encrypted = true;
            }
        } catch (e) { toast('Ошибка шифрования: ' + e.message, 'error'); return; }
    }

    const body = { text: payloadText, is_encrypted: encrypted };
    if (state.replyTo) body.reply_to = state.replyTo.id;

    if (!navigator.onLine) {
        state.offlineQueue.push({ chatId: chat.id, body, timestamp: Date.now() });
        localStorage.setItem('scp-offline-queue', JSON.stringify(state.offlineQueue));
        toast('Сообщение в очереди (оффлайн)', 'warn');
        clearReply();
        return;
    }

    try {
        const resp = await api(`/api/chats/${chat.id}/messages`, {
            method: 'POST',
            body: JSON.stringify(body)
        });
        const msg = await decryptIncoming(chat, resp);
        msg.reply_to = state.replyTo ? state.replyTo.id : null;
        if (!state.messages.find(x => x.id === msg.id)) state.messages.push(msg);
        renderMessages(true);
        clearReply();
    } catch (e) {
        if (e.status === 429) {
            state.msgCooldownUntil = Date.now() + 4000;
            toast(e.message, 'warn');
        } else if (e.data && e.data.autoHidden) {
            toast(e.message, 'error', 6000);
        } else {
            toast(e.message, 'error');
        }
    }
}

async function flushOfflineQueue() {
    if (!state.offlineQueue.length) return;
    toast(`Отправка ${state.offlineQueue.length} сообщений из очереди...`, 'info');
    const q = [...state.offlineQueue];
    state.offlineQueue = [];
    localStorage.setItem('scp-offline-queue', '[]');
    for (const item of q) {
        try {
            await api(`/api/chats/${item.chatId}/messages`, {
                method: 'POST',
                body: JSON.stringify(item.body)
            });
        } catch (e) { logErr('offline flush', e); }
    }
    if (state.activeChatId) openChat(state.activeChatId);
}

// ==========================================================================
// SEND FILE
// ==========================================================================
async function sendFile(file, caption) {
    caption = caption || '';
    const chat = state.chats.find(c => c.id === state.activeChatId);
    if (!chat) return;
    const isE2EE = !chat.isGroup && !chat.isHelper;

    const uploadId = 'up_' + Date.now();
    state.pendingUploads.set(uploadId, { name: file.name, size: file.size, progress: 0 });

    let uploadBlob = file;
    let encMeta = null;
    let uploadName = file.name || 'file';
    let uploadType = file.type || 'application/octet-stream';

    if (isE2EE) {
        try {
            toast('Шифрование файла...', 'info', 1500);
            const encrypted = await encryptFile(file);
            uploadBlob = encrypted.blob;
            encMeta = encrypted.meta;
            uploadName = 'file.bin';
            uploadType = 'application/octet-stream';
        } catch (e) {
            state.pendingUploads.delete(uploadId);
            toast('Не удалось зашифровать файл: ' + e.message, 'error');
            return;
        }
    }

    try {
        const urlResp = await api(`/api/chats/${chat.id}/get-upload-url`, {
            method: 'POST',
            body: JSON.stringify({ fileName: uploadName, fileType: uploadType, fileSize: uploadBlob.size })
        });

        // Upload с прогрессом через XHR
        await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('PUT', urlResp.uploadUrl);
            xhr.setRequestHeader('Content-Type', uploadType);
            xhr.upload.onprogress = e => {
                if (e.lengthComputable) {
                    const pct = Math.round(e.loaded / e.total * 100);
                    const p = state.pendingUploads.get(uploadId);
                    if (p) p.progress = pct;
                    const el2 = document.querySelector(`[data-upload-id="${uploadId}"] .msg-attachment-upload-progress`);
                    if (el2) el2.style.width = pct + '%';
                }
            };
            xhr.onload = () => xhr.status >= 200 && xhr.status < 300 ? resolve() : reject(new Error('HTTP ' + xhr.status));
            xhr.onerror = () => reject(new Error('Network error'));
            xhr.send(uploadBlob);
        });

        const fileObj = { key: urlResp.key, type: uploadType, name: uploadName, size: uploadBlob.size };
        if (encMeta) fileObj.enc_meta = encMeta;

        let captionText = caption;
        if (isE2EE && caption) {
            const key = await getDMKey(chat);
            if (key) captionText = await encryptText(key, caption);
        }

        const confirm = await api(`/api/chats/${chat.id}/confirm-upload`, {
            method: 'POST',
            body: JSON.stringify({
                files: [fileObj],
                caption: captionText,
                is_encrypted: isE2EE,
                reply_to: state.replyTo ? state.replyTo.id : null
            })
        });
        const msg = await decryptIncoming(chat, confirm);
        if (!state.messages.find(x => x.id === msg.id)) state.messages.push(msg);
        renderMessages(true);
        clearReply();
        state.pendingUploads.delete(uploadId);
    } catch (e) {
        state.pendingUploads.delete(uploadId);
        toast('Ошибка отправки файла: ' + e.message, 'error');
    }
}

async function sendMultipleFiles(files) {
    for (const file of files) {
        await sendFile(file);
    }
}

// VOICE RECORDING
// ==========================================================================
async function startVoiceRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const rec = new MediaRecorder(stream);
        const chunks = [];
        rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

        // Analyser для waveform
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        source.connect(analyser);

        state.voiceState = {
            recorder: rec,
            stream,
            chunks,
            startTime: Date.now(),
            timerId: null,
            audioCtx,
            analyser,
            waveformData: [],
            waveformId: null
        };

        rec.start();

        const overlay = $('#voice-overlay');
        if (overlay) overlay.hidden = false;
        const effectEl = $('#voice-effect');
        if (effectEl) effectEl.value = 'none';

        state.voiceState.timerId = setInterval(() => {
            const s = Math.floor((Date.now() - state.voiceState.startTime) / 1000);
            const timEl = $('#voice-timer');
            if (timEl) {
                timEl.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
            }
        }, 200);

        drawVoiceWaveform();
    } catch (e) {
        toast('Нет доступа к микрофону: ' + e.message, 'error');
    }
}

function drawVoiceWaveform() {
    const vs = state.voiceState;
    if (!vs) return;
    const container = $('#voice-waveform');
    if (!container) return;
    const bufferLength = vs.analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    const draw = () => {
        if (!state.voiceState) return;
        requestAnimationFrame(draw);
        vs.analyser.getByteFrequencyData(dataArray);
        const bars = 32;
        container.innerHTML = '';
        for (let i = 0; i < bars; i++) {
            const idx = Math.floor(i * bufferLength / bars);
            const val = dataArray[idx];
            const h = Math.max(4, val / 255 * 60);
            const bar = document.createElement('div');
            bar.className = 'voice-waveform-bar';
            bar.style.height = h + 'px';
            container.appendChild(bar);
        }
    };
    draw();
}

async function stopVoiceRecording() {
    const vs = state.voiceState;
    if (!vs || !vs.recorder) return;
    clearInterval(vs.timerId);
    return new Promise(resolve => {
        vs.recorder.onstop = async () => {
            vs.stream.getTracks().forEach(t => t.stop());
            try { vs.audioCtx.close(); } catch (e) {}
            const overlay = $('#voice-overlay');
            if (overlay) overlay.hidden = true;

            const blob = new Blob(vs.chunks, { type: 'audio/webm' });
            const effectEl = $('#voice-effect');
            const effect = effectEl ? effectEl.value : 'none';
            let finalBlob = blob;
            if (effect !== 'none') {
                try {
                    toast('Обработка звука...', 'info', 1200);
                    finalBlob = await applyVoiceEffect(blob, effect);
                } catch (e) { logErr('voice effect', e); toast('Эффект не применился', 'warn'); }
            }
            const duration = Math.round((Date.now() - vs.startTime) / 1000);
            if (duration < 1) { toast('Слишком короткая запись', 'warn'); state.voiceState = null; resolve(); return; }
            state.voiceState = null;
            await sendVoiceMessage(finalBlob, duration);
            resolve();
        };
        vs.recorder.stop();
    });
}

async function cancelVoiceRecording() {
    const vs = state.voiceState;
    if (!vs) return;
    clearInterval(vs.timerId);
    try { vs.recorder.stop(); } catch (e) {}
    try { vs.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    try { vs.audioCtx.close(); } catch (e) {}
    state.voiceState = null;
    const overlay = $('#voice-overlay');
    if (overlay) overlay.hidden = true;
}

async function applyVoiceEffect(blob, effect) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
    const src = ctx.createBufferSource();
    src.buffer = buf;
    let node = src;

    if (effect === 'radio') {
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 1800;
        bp.Q.value = 1.4;
        node.connect(bp);
        node = bp;
        const g = ctx.createGain();
        g.gain.value = 1.5;
        node.connect(g);
        node = g;
    } else if (effect === 'scp049') {
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 420;
        const dist = ctx.createWaveShaper();
        const curve = new Float32Array(4096);
        for (let i = 0; i < 4096; i++) {
            const x = (i * 2) / 4096 - 1;
            curve[i] = Math.tanh(x * 4);
        }
        dist.curve = curve;
        node.connect(lp);
        lp.connect(dist);
        node = dist;
    } else if (effect === 'noise') {
        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 700;
        node.connect(hp);
        node = hp;
        const g = ctx.createGain();
        g.gain.value = 0.8;
        node.connect(g);
        node = g;
    } else if (effect === 'chipmunk') {
        src.playbackRate.value = 1.5;
    } else if (effect === 'slowmo') {
        src.playbackRate.value = 0.75;
    } else if (effect === 'robot') {
        const ring = ctx.createOscillator();
        const ringGain = ctx.createGain();
        ring.frequency.value = 30;
        ringGain.gain.value = 0.5;
        ring.connect(ringGain);
        ringGain.connect(node.gain);
        ring.start();
        const g = ctx.createGain();
        g.gain.value = 1;
        node.connect(g);
        node = g;
    } else if (effect === 'echo') {
        const delay = ctx.createDelay(1);
        delay.delayTime.value = 0.25;
        const fb = ctx.createGain();
        fb.gain.value = 0.4;
        node.connect(delay);
        delay.connect(fb);
        fb.connect(delay);
        node.connect(ctx.destination);
        node = delay;
    }

    const dest = ctx.createMediaStreamDestination();
    node.connect(dest);
    const rec = new MediaRecorder(dest.stream);
    const out = [];
    rec.ondataavailable = e => { if (e.data.size > 0) out.push(e.data); };
    return new Promise(resolve => {
        rec.onstop = () => {
            try { ctx.close(); } catch (x) {}
            resolve(new Blob(out, { type: 'audio/webm' }));
        };
        rec.start();
        src.start();
        src.onended = () => setTimeout(() => rec.stop(), 100);
    });
}

async function sendVoiceMessage(blob, duration) {
    const chat = state.chats.find(c => c.id === state.activeChatId);
    if (!chat) return;
    try {
        const urlResp = await api(`/api/chats/${chat.id}/get-upload-url`, {
            method: 'POST',
            body: JSON.stringify({ fileName: 'voice.webm', fileType: 'audio/webm', fileSize: blob.size })
        });
        const up = await fetch(urlResp.uploadUrl, {
            method: 'PUT',
            body: blob,
            headers: { 'Content-Type': 'audio/webm' }
        });
        if (!up.ok) throw new Error('upload failed');
        const confirm = await api(`/api/chats/${chat.id}/confirm-upload`, {
            method: 'POST',
            body: JSON.stringify({
                files: [{ key: urlResp.key, type: 'audio/webm', name: 'voice.webm', size: blob.size }],
                caption: '',
                is_voice: true
            })
        });
        const msg = await decryptIncoming(chat, confirm);
        if (!state.messages.find(x => x.id === msg.id)) state.messages.push(msg);
        renderMessages(true);
    } catch (e) { toast('Ошибка отправки голосового: ' + e.message, 'error'); }
}

function startChatSearch() {
    const q = prompt('Поиск в чате:');
    if (!q || !q.trim()) return;
    state.chatSearchQuery = q.trim().toLowerCase();
    state.chatSearchMatches = [];
    state.chatSearchIndex = -1;
    state.messages.forEach(m => {
        if ((m.text || '').toLowerCase().includes(state.chatSearchQuery)) {
            state.chatSearchMatches.push(m.id);
        }
    });
    if (!state.chatSearchMatches.length) {
        toast('Не найдено', 'warn');
        return;
    }
    state.chatSearchIndex = 0;
    scrollToMessage(state.chatSearchMatches[0]);
    toast(`Найдено ${state.chatSearchMatches.length}`, 'info');
}

function nextSearchMatch() {
    if (!state.chatSearchMatches.length) return;
    state.chatSearchIndex = (state.chatSearchIndex + 1) % state.chatSearchMatches.length;
    scrollToMessage(state.chatSearchMatches[state.chatSearchIndex]);
}

function highlightSearchMatches() {
    const box = $('#messages');
    if (!box || !state.chatSearchQuery) return;
    const q = state.chatSearchQuery;
    box.querySelectorAll('.msg-bubble').forEach(bubble => {
        const orig = bubble.dataset.origText;
        if (!orig) return;
        // безопасный подход: работать с текстовыми узлами
        const walker = document.createTreeWalker(bubble, NodeFilter.SHOW_TEXT);
        const nodes = [];
        let n;
        while ((n = walker.nextNode())) nodes.push(n);
        nodes.forEach(node => {
            const text = node.nodeValue;
            if (!text || text.toLowerCase().indexOf(q) === -1) return;
            const frag = document.createDocumentFragment();
            let i = 0;
            const lower = text.toLowerCase();
            while (i < text.length) {
                const idx = lower.indexOf(q, i);
                if (idx === -1) {
                    frag.appendChild(document.createTextNode(text.slice(i)));
                    break;
                }
                frag.appendChild(document.createTextNode(text.slice(i, idx)));
                const mark = document.createElement('mark');
                mark.style.background = 'var(--warn)';
                mark.style.color = 'var(--bg)';
                mark.textContent = text.slice(idx, idx + q.length);
                frag.appendChild(mark);
                i = idx + q.length;
            }
            node.parentNode.replaceChild(frag, node);
        });
    });
}

const sendTypingThrottled = throttle(() => {
    if (!state.socket || !state.activeChatId) return;

    if (state.typingTimer) clearTimeout(state.typingTimer);

        }
    }, 3000);
}, 2000);

// ==========================================================================
// ATTACHMENT PASTE / DRAG-DROP
// ==========================================================================
function setupDragDrop() {
    const area = $('#chat-area');
    if (!area) return;
    let dragCounter = 0;

    area.addEventListener('dragenter', e => {
        e.preventDefault();
        dragCounter++;
        if (dragCounter === 1) {
            area.style.outline = '3px dashed var(--accent)';
            area.style.outlineOffset = '-8px';
        }
    });
    area.addEventListener('dragleave', e => {
        e.preventDefault();
        dragCounter--;
        if (dragCounter === 0) {
            area.style.outline = '';
            area.style.outlineOffset = '';
        }
    });
    area.addEventListener('dragover', e => e.preventDefault());
    area.addEventListener('drop', async e => {
        e.preventDefault();
        dragCounter = 0;
        area.style.outline = '';
        area.style.outlineOffset = '';
        if (e.dataTransfer.files && e.dataTransfer.files.length) {
            await sendMultipleFiles(Array.from(e.dataTransfer.files));
        }
    });
}

function setupPasteUpload() {
    const input = $('#msg-input');
    if (!input) return;
    input.addEventListener('paste', async e => {
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        const files = [];
        for (const item of items) {
            if (item.kind === 'file') {
                const f = item.getAsFile();
                if (f) files.push(f);
            }
        }
        if (files.length) {
            e.preventDefault();
            await sendMultipleFiles(files);
        }
    });
}

// ОБРАБОТЧИКИ СОБЫТИЙ (часть 2, остальные в части 3)
// ==========================================================================
function bindMessagingEvents() {
    const box = $('#messages');
    if (box) {
        box.addEventListener('scroll', () => {
            updateScrollBottomVisibility();
            if (box.scrollHeight - box.scrollTop - box.clientHeight < 100) {
                hideScrollBottom();
                if (state.activeChatId) markRead(state.activeChatId);
            }
        }, { passive: true });
    }

    const scrollBtn = $('#scroll-bottom-btn');
    if (scrollBtn) {
        scrollBtn.onclick = () => {
            if (box) box.scrollTop = box.scrollHeight;
            hideScrollBottom();
        };
    }

    const msgInput = $('#msg-input');
    if (msgInput) {
        msgInput.addEventListener('input', () => {
            sendTypingThrottled();
        });
    }

    const cancelReplyBtn = $('#btn-cancel-reply');
    if (cancelReplyBtn) cancelReplyBtn.onclick = clearReply;

    const emojiBtn = $('#btn-emoji');
    if (emojiBtn) emojiBtn.onclick = e => { e.stopPropagation(); openEmojiPicker(); };

    const chatSearchBtn = $('#btn-chat-search');
    if (chatSearchBtn) chatSearchBtn.onclick = startChatSearch;

    const voiceCancelBtn = $('#btn-voice-cancel');
    if (voiceCancelBtn) voiceCancelBtn.onclick = cancelVoiceRecording;

    const voiceStopBtn = $('#btn-voice-stop');
    if (voiceStopBtn) voiceStopBtn.onclick = stopVoiceRecording;

    window.addEventListener('online', () => {
        toast('Онлайн — отправляем очередь', 'success');
        flushOfflineQueue();
    });
    window.addEventListener('offline', () => toast('Оффлайн — сообщения будут в очереди', 'warn'));

    setupDragDrop();
    setupPasteUpload();
}

async function openUserProfile(userId) {
    if (!userId) return;
    let u = state.users_cache.get(userId);
    if (!u) {
        try { u = await api(`/api/users/${userId}`); state.users_cache.set(userId, u); }
        catch (e) { toast('Профиль не найден', 'error'); return; }
    }
    const body = el('div');
    const initials = (u.displayName || u.username || '?')[0].toUpperCase();
    const header = el('div', { class: 'profile-header' },
        el('div', { class: 'profile-avatar' },
            u.avatarUrl
                ? el('img', { src: u.avatarUrl, alt: '' })
                : initials
        ),
        el('div', { class: 'profile-name', text: u.displayName || u.username }),
        el('div', { class: 'profile-username', text: '@' + u.username }),
        u.custom_status
            ? el('div', { class: 'profile-status', text: '“' + u.custom_status + '”' })
            : null
    );

    const info = el('div', { class: 'profile-info' });
    const rows = [
        ['Роль', ROLE_NAMES[u.role] || u.role],
        ['Допуск', 'L' + (u.clearance_level || 1) + ' — ' + (CLEARANCE_NAMES[u.clearance_level] || '?')],
        ['XP', String(u.xp || 0)],
        ['Статус', u.ban_expires ? '🚫 Забанен' : (state.onlineUsers.has(u.id) ? '🟢 Онлайн' : '⚫ Офлайн')]
    ];
    if (u.ip) rows.push(['IP', u.ip]);
    if (u.created_at) rows.push(['Регистрация', fmtDateFull(u.created_at)]);
    rows.forEach(([label, value]) => {
        info.appendChild(el('div', { class: 'profile-info-row' },
            el('div', { class: 'profile-info-label', text: label }),
            el('div', { class: 'profile-info-value', text: value })
        ));
    });

    body.append(header, info);

    const footer = [];
    if (u.id !== state.me.id) {
        const msgBtn = el('button', { class: 'btn-primary', type: 'button' }, '✉ Написать');
        msgBtn.onclick = async () => {
            try {
                const chat = await api('/api/chats', { method: 'POST', body: JSON.stringify({ userId: u.id }) });
                await loadChats();
                openChat(chat.id);
                closeModal();
            } catch (e) { toast(e.message, 'error'); }
        };
        footer.push(msgBtn);

        const reportBtn = el('button', { class: 'btn-secondary', type: 'button' }, '⚠ Жалоба');
        reportBtn.onclick = () => { closeModal(); openReportModal(u.id); };
        footer.push(reportBtn);

        const blockBtn = el('button', { class: 'btn-secondary', type: 'button', style: 'color:var(--danger)' }, '🚫 Блок');
        blockBtn.onclick = async () => {
            if (!confirm('Заблокировать @' + u.username + '?')) return;
            try {
                await api(`/api/users/${u.id}/block`, { method: 'POST' });
                toast('Заблокирован', 'success');
                closeModal();
                await loadChats();
            } catch (e) { toast(e.message, 'error'); }
        };
        footer.push(blockBtn);
    }
    openModal('Профиль агента', body, footer);
}

            blockBtn.onclick = async () => {
                try {
                    const url = chat.blockedByMe
                        ? `/api/users/${chat.otherUserId}/unblock`
                        : `/api/users/${chat.otherUserId}/block`;
                    await api(url, { method: 'POST' });
                    toast('Готово', 'success');
                    await loadChats();
                    openChatInfo();
                } catch (e) { toast(e.message, 'error'); }
            };
            actions.appendChild(blockBtn);
        }
        if (chat.isGroup && chat.creatorId === state.me.id) {
            const leaveBtn = el('button', { class: 'btn-secondary', type: 'button', style: 'width:100%;margin-bottom:6px' }, '🎟 Пригласить');
            leaveBtn.onclick = openInviteModal;
            actions.appendChild(leaveBtn);

            const delBtn = el('button', { class: 'btn-danger', type: 'button', style: 'width:100%;margin-bottom:6px' }, '🗑 Удалить чат');
            delBtn.onclick = async () => {
                if (!confirm('Удалить чат для всех?')) return;
                try {
                    await api(`/api/chats/${chat.id}`, { method: 'DELETE' });
                    toast('Удалён', 'success');
                    panel.hidden = true;
                    state.activeChatId = null;
                    $('#chat-view').hidden = true;
                    $('#chat-empty').hidden = false;
                    await loadChats();
                } catch (e) { toast(e.message, 'error'); }
            };
            actions.appendChild(delBtn);
        } else if (chat.isGroup) {
            const leaveBtn = el('button', { class: 'btn-danger', type: 'button', style: 'width:100%' }, '🚪 Покинуть');
            leaveBtn.onclick = async () => {
                if (!confirm('Покинуть группу?')) return;
                try {
                    await api(`/api/chats/${chat.id}/leave`, { method: 'POST' });
                    toast('Вы покинули', 'success');
                    panel.hidden = true;
                    state.activeChatId = null;
                    $('#chat-view').hidden = true;
                    $('#chat-empty').hidden = false;
                    await loadChats();
                } catch (e) { toast(e.message, 'error'); }
            };
            actions.appendChild(leaveBtn);
        }
        content.appendChild(actions);
    } catch (e) { body.innerHTML = `<div class="modal-warn">${escapeHtml(e.message)}</div>`; }
}

// INVITE MODAL
// ==========================================================================
async function openInviteModal() {
    const chat = state.chats.find(c => c.id === state.activeChatId);
    if (!chat || !chat.isGroup) { toast('Только для групп', 'warn'); return; }

    const body = el('div');
    const search = el('input', { type: 'search', class: 'modal-search', placeholder: 'Поиск агента...' });
    const list = el('div');
    body.append(search, list);

    const all = await api('/api/users/all').catch(() => []);
    const members = await api(`/api/chats/${chat.id}/members`).catch(() => []);
    const memberIds = new Set(members.map(m => m.id));
    const selected = new Set();
    const existing = db_existingInvites; // заглушка

    const render = () => {
        list.innerHTML = '';
        const q = search.value.toLowerCase();
        all.filter(u => !memberIds.has(u.id))
            .filter(u => !q || u.username.toLowerCase().includes(q) || (u.displayName || '').toLowerCase().includes(q))
            .slice(0, 50)
            .forEach(u => {
                const cb = el('input', { type: 'checkbox' });
                if (selected.has(u.id)) cb.checked = true;
                cb.onchange = () => { if (cb.checked) selected.add(u.id); else selected.delete(u.id); };
                list.appendChild(el('label', { class: 'modal-user-row', style: 'cursor:pointer' },
                    cb,
                    el('div', { style: 'flex:1' },
                        el('div', {}, u.displayName || u.username),
                        el('div', { style: 'font-size:11px;color:var(--text-dim)' }, '@' + u.username + ' · L' + u.clearance_level)
                    )
                ));
            });
    };
    search.oninput = render;
    render();

    const send = el('button', { class: 'btn-primary', type: 'button' }, '📨 Пригласить');
    send.onclick = async () => {
        if (!selected.size) { toast('Выберите агентов', 'warn'); return; }
        try {
            await api(`/api/chats/${chat.id}/invite`, {
                method: 'POST',
                body: JSON.stringify({ userIds: [...selected] })
            });
            toast('Приглашения отправлены', 'success');
            closeModal();
        } catch (e) { toast(e.message, 'error'); }
    };
    openModal('🎟 Пригласить в ' + (chat.name || ''), body, [send]);
}
const db_existingInvites = [];

async function openNewChatModal() {
    const body = el('div');
    const search = el('input', { type: 'search', class: 'modal-search', placeholder: 'Поиск агента или канала...' });
    const results = el('div');
    body.append(search, results);

    const run = debounce(async () => {
        const q = search.value.trim();
        if (!q) { results.innerHTML = ''; return; }
        try {
            const r = await api(`/api/users/search?q=${encodeURIComponent(q)}`);
            results.innerHTML = '';
            (r.users || []).forEach(u => {
                const row = el('div', { class: 'modal-user-row' });
                const av = el('div', { class: 'msg-avatar' }, (u.displayName || u.username)[0].toUpperCase());
                row.append(av, el('div', {},
                    el('div', { text: u.displayName || u.username }),
                    el('div', { style: 'font-size:11px;color:var(--text-dim)' }, '@' + u.username + ' · L' + u.clearance_level)
                ));
                row.onclick = async () => {
                    try {
                        const chat = await api('/api/chats', { method: 'POST', body: JSON.stringify({ userId: u.id }) });
                        await loadChats();
                        openChat(chat.id);
                        closeModal();
                    } catch (e) { toast(e.message, 'error'); }
                };
                results.appendChild(row);
            });
            (r.chats || []).forEach(c => {
                const row = el('div', { class: 'modal-user-row' });
                row.append(
                    el('div', { class: 'msg-avatar' }, c.isChannel ? '📢' : '👥'),
                    el('div', {},
                        el('div', { text: c.name || '—' }),
                        el('div', { style: 'font-size:11px;color:var(--text-dim)' },
                            (c.isChannel ? 'Канал' : 'Группа') + (c.username ? ' · scp.me/' + c.username : '') + ' · L' + c.required_clearance)
                    )
                );
                results.appendChild(row);
            });
        } catch (e) { toast(e.message, 'error'); }
    }, 300);
    search.oninput = run;

    const mk = el('button', { class: 'btn-primary', type: 'button' }, '👥 Создать группу');
    mk.onclick = () => { closeModal(); openCreateGroupModal(); };
    openModal('➕ Новый чат', body, [mk]);
}

async function openCreateGroupModal() {
    if ((state.me.clearance_level || 1) < 4) {
        toast('Для создания групп нужен допуск L4', 'warn');
        return;
    }
    const body = el('div');
    const nameI = el('input', { type: 'text', placeholder: 'Название', maxlength: '64' });
    const isChannelI = el('input', { type: 'checkbox' });
    const isBlackI = el('input', { type: 'checkbox' });
    const usernameI = el('input', { type: 'text', placeholder: 'username (для канала)', maxlength: '32' });
    const reqCI = el('select', {});
    const writeCI = el('select', {});
    for (let i = 1; i <= 5; i++) {
        reqCI.appendChild(el('option', { value: i }, 'L' + i));
        writeCI.appendChild(el('option', { value: i }, 'L' + i));
    }
    reqCI.value = String(state.me.clearance_level);
    writeCI.value = '1';
    const members = el('div');

    const all = await api('/api/users/all').catch(() => []);
    const selected = new Set();
    all.slice(0, 40).forEach(u => {
        const cb = el('input', { type: 'checkbox' });
        cb.onchange = () => { if (cb.checked) selected.add(u.id); else selected.delete(u.id); };
        members.appendChild(el('label', { class: 'modal-user-row', style: 'cursor:pointer' },
            cb, el('div', {}, '@' + u.username + ' · L' + u.clearance_level)));
    });

    body.append(
        el('div', {}, el('label', {}, 'Название'), nameI),
        el('div', {}, el('label', { class: 'modal-checkbox' }, isChannelI, ' 📢 Канал (публичный)')),
        el('div', {}, el('label', { class: 'modal-checkbox' }, isBlackI, ' 🕵 Чёрный канал (анонимные сообщения)')),
        el('div', {}, el('label', {}, 'Username (для канала)'), usernameI),
        el('div', {}, el('label', {}, 'Мин. допуск на чтение'), reqCI),
        el('div', {}, el('label', {}, 'Мин. допуск на запись'), writeCI),
        el('div', {}, el('label', {}, 'Участники'), members)
    );
    const go = el('button', { class: 'btn-primary', type: 'button' }, 'Создать');
    go.onclick = async () => {
        try {
            const r = await api('/api/chats/group', {
                method: 'POST',
                body: JSON.stringify({
                    name: nameI.value.trim(),
                    memberIds: [...selected],
                    is_channel: isChannelI.checked,
                    is_black_channel: isBlackI.checked,
                    username: isChannelI.checked ? usernameI.value.trim() : null,
                    required_clearance: Number(reqCI.value),
                    min_write_clearance: Number(writeCI.value)
                })
            });
            toast('Создано!', 'success');
            await loadChats();
            openChat(r.chatId);
            closeModal();
        } catch (e) { toast(e.message, 'error'); }
    };
    openModal('👥 Новая группа / канал', body, [go]);
}

function toggleAdmin() {
    state.adminOpen = !state.adminOpen;

    if (panel) panel.hidden = !state.adminOpen;
    if (app) app.classList.toggle('admin-open', state.adminOpen);

function loadAdminTab(tab) {
    state.adminTab = tab;
    $$('.admin-tab').forEach(b => b.classList.toggle('active', b.dataset.atab === tab));
    const box = $('#admin-content');
    if (!box) return;
    box.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px">Загрузка...</div>';
    if (tab === 'stats') loadAdminStats();
    else if (tab === 'users') loadAdminUsers();
    else if (tab === 'reports') loadAdminReports();
    else if (tab === 'o5') loadAdminO5();
    else if (tab === 'chats') loadAdminChats();
    else if (tab === 'audit') loadAdminAudit();
    else if (tab === 'tools') loadAdminTools();
}

async function loadAdminStats() {
    const box = $('#admin-content');
    try {
        const s = await api('/api/admin/stats');
        const totalMsgs = s.msgsPerDay.reduce((a, b) => a + b, 0);
        const totalUsers = s.usersPerDay.reduce((a, b) => a + b, 0);
        const days = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
        const maxM = Math.max(...s.msgsPerDay, 1);
        const barsHtml = s.msgsPerDay.map((v, i) =>
            `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1">
                <div style="font-size:10px;color:var(--text-dim)">${v}</div>
                <div style="width:100%;background:var(--accent-dim);height:${Math.round(v / maxM * 60)}px;border-radius:2px 2px 0 0;min-height:2px"></div>
                <div style="font-size:9px;color:var(--text-dimmer)">${days[i]}</div>
            </div>`
        ).join('');

        box.innerHTML = `
            <div class="admin-section">
                <h3>📊 Статистика (7 дней)</h3>
                <div class="admin-stat-grid">
                    <div class="admin-stat"><div class="admin-stat-value">${totalMsgs}</div><div class="admin-stat-label">Сообщений</div></div>
                    <div class="admin-stat"><div class="admin-stat-value">${totalUsers}</div><div class="admin-stat-label">Новых агентов</div></div>
                </div>
                <div style="display:flex;align-items:flex-end;height:90px;gap:4px;margin-top:12px">${barsHtml}</div>
            </div>
            <div class="admin-section">
                <h3>🏆 Топ-5 агентов</h3>
                ${(s.topUsers || []).map((u, i) =>
                    `<div class="admin-row"><b>#${i + 1}</b> @${escapeHtml(u.username)} — ${u.count} сообщ.</div>`
                ).join('') || '<div class="dim-text">Нет данных</div>'}
            </div>
        `;
    } catch (e) { box.innerHTML = `<div class="modal-warn">${escapeHtml(e.message)}</div>`; }
}

// ==========================================================================
// ADMIN: USERS
// ==========================================================================
async function loadAdminUsers() {
    const box = $('#admin-content');
    try {
        const users = await api('/api/admin/users-list');
        box.innerHTML = '';
        const search = el('input', { type: 'search', placeholder: 'Фильтр по нику...', class: 'admin-input' });
        const list = el('div');
        const render = () => {
            list.innerHTML = '';
            const q = search.value.toLowerCase();
            users.filter(u => !q || u.username.toLowerCase().includes(q)).forEach(u => {
                const row = el('div', { class: 'admin-row' });
                row.innerHTML = `
                    <div class="admin-row-title">@${escapeHtml(u.username)} ${u.ban_expires ? '🚫' : ''}
                        <span style="color:var(--text-dim)">L${u.clearance_level} · ${escapeHtml(u.role)}</span>
                    </div>
                    <div class="admin-row-sub">XP: ${u.xp || 0} · ${escapeHtml(u.status || 'offline')} · ${u.ban_expires ? 'ЗАБАНЕН' : 'OK'}</div>
                `;
                const acts = el('div', { class: 'admin-row-actions' });

                const banBtn = el('button', { class: 'admin-btn danger', type: 'button' }, u.ban_expires ? 'Разбан' : 'Бан');
                banBtn.onclick = async () => {
                    if (u.ban_expires) {
                        try {
                            await api('/api/admin/ban-user', { method: 'POST', body: JSON.stringify({ username: u.username, duration: 0 }) });
                            loadAdminUsers();
                        } catch (e) { toast(e.message, 'error'); }
                    } else {
                        const dur = prompt('Длительность (мин, -1=перма):', '-1');
                        if (dur === null) return;
                        const reason = prompt('Причина:', 'Нарушение правил') || '';
                        try {
                            await api('/api/admin/ban-user', { method: 'POST', body: JSON.stringify({ username: u.username, duration: Number(dur), reason }) });
                            loadAdminUsers();
                        } catch (e) { toast(e.message, 'error'); }
                    }
                };
                acts.appendChild(banBtn);

                if (['admin', 'sysadmin'].includes(state.me.role)) {
                    const roleSel = el('select', { class: 'admin-select' });
                    ['user','helper','moderator','admin','sysadmin'].forEach(r => {
                        const opt = el('option', { value: r }, r);
                        if (r === u.role) opt.selected = true;
                        roleSel.appendChild(opt);
                    });
                    roleSel.onchange = async () => {
                        try {
                            await api('/api/admin/set-role', { method: 'POST', body: JSON.stringify({ username: u.username, role: roleSel.value }) });
                            toast('Роль обновлена', 'success');
                        } catch (e) { toast(e.message, 'error'); loadAdminUsers(); }
                    };
                    acts.appendChild(roleSel);
                }

                if (state.me.role === 'sysadmin') {
                    const cSel = el('select', { class: 'admin-select' });
                    [1,2,3,4,5].forEach(l => {
                        const opt = el('option', { value: l }, 'L' + l);
                        if (l === u.clearance_level) opt.selected = true;
                        cSel.appendChild(opt);
                    });
                    cSel.onchange = async () => {
                        try {
                            await api('/api/admin/set-clearance', { method: 'POST', body: JSON.stringify({ username: u.username, clearance_level: Number(cSel.value) }) });
                            toast('Допуск обновлён', 'success');
                        } catch (e) { toast(e.message, 'error'); }
                    };
                    acts.appendChild(cSel);
                }

                const delBtn = el('button', { class: 'admin-btn danger', type: 'button' }, 'Удалить');
                delBtn.onclick = async () => {
                    if (!confirm('Удалить @' + u.username + '?')) return;
                    try {
                        await api('/api/admin/delete-user', { method: 'POST', body: JSON.stringify({ username: u.username }) });
                        loadAdminUsers();
                    } catch (e) { toast(e.message, 'error'); }

function closeModal() {

}

// ==========================================================================
// BIND EVENTS (полный)
// ==========================================================================
function bindEvents() {
    // --- Login tabs ---
    $$('.login-tab').forEach(t => {
        t.onclick = () => {
            $$('.login-tab').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            const isLogin = t.dataset.tab === 'login';
            $('#login-form').hidden = !isLogin;
            $('#register-form').hidden = isLogin;
        };
    });

    // --- Password strength ---
    const regPwd = $('#reg-password');
    if (regPwd) {
        regPwd.oninput = () => {
            const v = regPwd.value;
            const bar = $('#pwd-strength-bar');
            if (!bar) return;
            let score = 0;
            if (v.length >= 6) score++;
            if (v.length >= 10) score++;
            if (/[A-Z]/.test(v)) score++;
            if (/[0-9]/.test(v)) score++;
            if (/[^A-Za-z0-9]/.test(v)) score++;
            const pct = score * 20;
            bar.style.width = pct + '%';
            bar.style.background = score <= 2 ? 'var(--danger)' : score === 3 ? 'var(--warn)' : 'var(--accent)';
        };
    }

    // --- Login submit ---
    const loginForm = $('#login-form');
    if (loginForm) {
        loginForm.onsubmit = async e => {
            e.preventDefault();
            const username = $('#login-username').value.trim();
            const password = $('#login-password').value;
            $('#login-error').textContent = '';
            try {
                await api('/api/login', { method: 'POST', body: JSON.stringify({ username, password }) });
                location.reload();
            } catch (err) {
                $('#login-error').textContent = err.message || 'Ошибка входа';
            }
        };
    }

    // --- Register submit ---
    const registerForm = $('#register-form');
    if (registerForm) {
        registerForm.onsubmit = async e => {
            e.preventDefault();
            const username = $('#reg-username').value.trim();
            const password = $('#reg-password').value;
            const invite_code = $('#reg-invite').value.trim();
            $('#register-error').textContent = '';
            try {
                await api('/api/register', { method: 'POST', body: JSON.stringify({ username, password, invite_code }) });
                location.reload();
            } catch (err) {
                $('#register-error').textContent = err.message || 'Ошибка регистрации';
            }
        };
    }

    // --- Sidebar tabs ---
    $$('.tab-btn').forEach(t => {
        t.onclick = () => {
            $$('.tab-btn').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            const isChats = t.dataset.tab === 'chats';
            $('#chat-list').hidden = !isChats;
            $('#contact-list').hidden = isChats;
        };
    });

    // --- Search ---
    const searchInput = $('#search-input');
    if (searchInput) {
        searchInput.oninput = debounce(async e => {
            const q = e.target.value.trim();
            if (!q) { loadChats(); return; }
            try {
                const r = await api(`/api/users/search?q=${encodeURIComponent(q)}`);
                const list = $('#chat-list');
                list.innerHTML = '';
                (r.users || []).forEach(u => {
                    const item = el('div', { class: 'chat-item' });
                    item.append(
                        el('div', { class: 'chat-item-avatar' }, (u.displayName || u.username)[0].toUpperCase()),
                        el('div', { class: 'chat-item-body' },
                            el('div', { class: 'chat-item-name' }, u.displayName || u.username),
                            el('div', { class: 'chat-item-preview' }, '@' + u.username + ' · L' + u.clearance_level))
                    );
                    item.onclick = async () => {
                        try {
                            const chat = await api('/api/chats', { method: 'POST', body: JSON.stringify({ userId: u.id }) });
                            await loadChats();
                            openChat(chat.id);
                            searchInput.value = '';
                        } catch (e) { toast(e.message, 'error'); }
                    };
                    list.appendChild(item);
                });
                (r.chats || []).forEach(c => {
                    const item = el('div', { class: 'chat-item' });
                    item.append(
                        el('div', { class: 'chat-item-avatar' }, c.isChannel ? '📢' : '👥'),
                        el('div', { class: 'chat-item-body' },
                            el('div', { class: 'chat-item-name' }, c.name || '—'),
                            el('div', { class: 'chat-item-preview' },
                                (c.isChannel ? 'Канал' : 'Группа') + (c.username ? ' · scp.me/' + c.username : '')))
                    );
                    list.appendChild(item);
                });
            } catch (e) { logErr('search', e); }
        }, 300);
    }

    // --- Composer ---
    const sendBtn = $('#btn-send');
    if (sendBtn) sendBtn.onclick = sendFromInput;

    const msgInput = $('#msg-input');
    if (msgInput) {
        msgInput.onkeydown = e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendFromInput();
            }
        };
    }

    // --- Attach / Mic / New / Settings / Admin ---
    const attachBtn = $('#btn-attach');
    if (attachBtn) {
        attachBtn.onclick = () => {
            const inp = $('#file-input');
            inp.value = '';
            inp.onchange = () => {
                if (inp.files && inp.files.length) {
                    sendMultipleFiles(Array.from(inp.files));
                }
            };
            inp.click();
        };
    }
    const micBtn = $('#btn-mic');
    if (micBtn) micBtn.onclick = startVoiceRecording;
    const newChatBtn = $('#btn-new-chat');
    if (newChatBtn) newChatBtn.onclick = openNewChatModal;
    const settingsBtn = $('#btn-settings');
    if (settingsBtn) settingsBtn.onclick = openSettings;
    const adminBtn = $('#btn-admin');
    if (adminBtn) adminBtn.onclick = toggleAdmin;
    const adminClose = $('#btn-admin-close');
    if (adminClose) adminClose.onclick = toggleAdmin;

    // --- Chat header ---
    const chatInfoBtn = $('#btn-chat-info');
    if (chatInfoBtn) chatInfoBtn.onclick = openChatInfo;
    const chatSearchBtn = $('#btn-chat-search');
    if (chatSearchBtn) chatSearchBtn.onclick = startChatSearch;
    const closeChatInfoBtn = $('#btn-close-chat-info');
    if (closeChatInfoBtn) closeChatInfoBtn.onclick = closeChatInfo;

    // --- Admin tabs ---
    $$('.admin-tab').forEach(t => {
        t.onclick = () => loadAdminTab(t.dataset.atab);
    });

    // --- Avatar upload ---
    const avatarInput = $('#avatar-input');
    if (avatarInput) {
        avatarInput.onchange = async e => {
            const file = e.target.files[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('avatar', file);
            try {
                const resp = await fetch('/api/users/avatar', { method: 'POST', credentials: 'include', body: fd });
                if (!resp.ok) throw new Error('Upload failed');
                state.me = await api('/api/me');
                renderMe();
                toast('Аватар обновлён', 'success');
            } catch (err) { toast(err.message, 'error'); }
        };
    }

    // --- Modal backdrop click ---
    const modalRoot = $('#modal-root');
    if (modalRoot) {
        modalRoot.addEventListener('click', e => {
            if (e.target === modalRoot) closeModal();
        });
    }

    // --- Visibility ---
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && state.activeChatId) markRead(state.activeChatId);
    });

    // --- Hotkeys ---
    document.addEventListener('keydown', e => {
        // Esc
        if (e.key === 'Escape') {
            const modal = $('#modal-root');
            if (modal && !modal.hidden) { closeModal(); return; }
            const voice = $('#voice-overlay');
            if (voice && !voice.hidden) { cancelVoiceRecording(); return; }
            if (state.chatInfoOpen) { closeChatInfo(); return; }
            if (state.lightboxOpen) {
                const lb = $('#lightbox-root');
                if (lb) lb.innerHTML = '';
                state.lightboxOpen = false;
                return;
            }
            if (state.emojiPickerOpen) { closeEmojiPicker(); return; }
            if (state.replyTo) { clearReply(); return; }
            if (state.editingMessage) { cancelEdit(); return; }
        }
        // Ctrl/Cmd combos
        const ctrl = e.ctrlKey || e.metaKey;
        if (ctrl && e.key === 'k') { e.preventDefault(); const s = $('#search-input'); if (s) s.focus(); }
        if (ctrl && e.key === 'n') { e.preventDefault(); openNewChatModal(); }
        if (ctrl && e.key === ',') { e.preventDefault(); openSettings(); }
        if (ctrl && e.shiftKey && (e.key === 'A' || e.key === 'a')) { e.preventDefault(); if (!$('#btn-admin').hidden) toggleAdmin(); }
        if (ctrl && e.key === 'f') { e.preventDefault(); if (state.activeChatId) startChatSearch(); }
        if (ctrl && e.key === 'Enter') { e.preventDefault(); sendFromInput(); }
        // Alt+стрелки для навигации по сообщениям
        if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
            e.preventDefault();
            if (!state.chatSearchMatches.length) return;
            nextSearchMatch();
        }
    });

    // --- SW message ---
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', e => {
            if (e.data && e.data.type === 'openChat' && e.data.url) {
                const m = e.data.url.match(/chat=([^&]+)/);
                if (m) openChat(m[1]);
            }
        });
    }
}

function sendFromInput() {
    const input = $('#msg-input');

    const text = input.value;
    if (!text.trim()) return;
